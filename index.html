<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048 덱빌딩 던전</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:"Segoe UI","Malgun Gothic",sans-serif; touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  #stage { position:absolute; top:50%; left:50%; width:1080px; height:1920px; transform-origin:center; background:#1c1726; overflow:hidden; }
  #game { position:absolute; inset:0; background:linear-gradient(#241d33,#17121f); }

  #topbar { position:absolute; top:0; left:0; width:100%; padding:16px 20px 6px; z-index:20; }
  #bossName { font-size:26px; color:#eee; text-align:center; }
  #bossName b { color:#ff8a5a; }
  #phaseTag { color:#ffd166; font-size:22px; }
  #bossHpBar { margin-top:8px; height:40px; background:#3a0d0d; border:4px solid #000; border-radius:20px; overflow:hidden; position:relative; }
  #bossHpFill { height:100%; width:100%; background:linear-gradient(#ff4d4d,#a01818); transition:width .3s; }
  #bossHpText { position:absolute; inset:0; text-align:center; line-height:40px; font-size:22px; font-weight:bold; color:#fff; text-shadow:0 2px 2px #000; }
  #bossStun { position:absolute; top:2px; right:26px; font-size:30px; display:none; z-index:21; filter:drop-shadow(0 0 6px #ffec5a); }
  #bossStun.on{ display:block; animation:intentPulse 1s infinite; }

  #bossIntent { margin:12px auto 0; width:max-content; max-width:96%; background:#0e0b16dd; border:3px solid #6a5a2a; border-radius:14px; padding:6px 20px;
    display:flex; align-items:center; gap:10px; color:#fff; font-size:32px; font-weight:900; text-shadow:0 2px 3px #000; box-shadow:0 4px 10px #000a; }
  #bossIntent.attack{ border-color:#c0392b; } #bossIntent.summon{ border-color:#8e44ad; } #bossIntent.destroy{ border-color:#e67e22; }
  #bossIntent .iIcon{ font-size:36px; } #bossIntent .iVal{ color:#ffde59; }
  @keyframes intentPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  #bossIntent.pulse{ animation:intentPulse 1.4s ease-in-out infinite; }

  #bossArt { position:absolute; top:250px; left:0; width:100%; height:160px; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #bossArt img { height:160px; image-rendering:pixelated; filter:drop-shadow(0 0 24px #ff3b0088) drop-shadow(0 8px 10px #000a); }
  #bossArt.hurt img { filter:drop-shadow(0 0 14px #f00) brightness(1.8) sepia(1) hue-rotate(-40deg) saturate(6) !important; }
  #bossArt.punch img { animation:punch .25s ease-out; }

  #strBadge { position:absolute; top:250px; left:24px; min-width:74px; height:74px; padding:0 10px; border-radius:20px; z-index:22;
    background:radial-gradient(circle at 40% 35%,#ffb56b,#a03c10); border:4px solid #7a2e08;
    display:none; align-items:center; justify-content:center; gap:4px; font-size:30px; font-weight:900; color:#fff; text-shadow:0 2px 3px #000; box-shadow:0 4px 10px #000a; }
  #strBadge.show{ display:flex; }
  #strBadge.bump{ animation:blockPulse .3s; }

  #buffBar { position:absolute; top:334px; left:24px; z-index:23; display:flex; flex-direction:column; gap:8px; }
  .buffChip { min-width:74px; height:60px; padding:0 12px; border-radius:16px;
    background:radial-gradient(circle at 40% 35%,#9b6bff,#3a1a7a); border:4px solid #2a0e5a;
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:26px; font-weight:900; color:#fff; text-shadow:0 2px 3px #000; box-shadow:0 4px 10px #000a; cursor:pointer; pointer-events:auto; }
  .buffChip.bump{ animation:blockPulse .3s; }
  #buffTip { position:absolute; z-index:470; max-width:360px; background:#0e0b16f2; border:3px solid #9b6bff; border-radius:14px;
    padding:12px 16px; color:#eee; font-size:22px; line-height:1.4; box-shadow:0 6px 16px #000c; display:none; }
  #buffTip.on{ display:block; }
  #buffTip b{ color:#c9a8ff; }

  #fieldWrap { position:absolute; left:50%; transform:translateX(-50%); }
  #field { position:relative; background:#15111faa; border:4px solid #0e0b16; border-radius:16px; }
  .fslot { position:absolute; background:#1d1830; border:2px solid #2a233e; border-radius:10px; }
  .colOverlay { position:absolute; border-radius:12px; pointer-events:none; z-index:6; }
  .colOverlay.atkLine { background:linear-gradient(#ff2b2b33,#ff2b2b11); border:3px dashed #ff4d4d; box-shadow:0 0 18px #ff2b2b55 inset; animation:pulseLine 1.2s ease-in-out infinite; }
  @keyframes pulseLine{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .summonMark { position:absolute; z-index:9; display:flex; align-items:center; justify-content:center; font-size:64px; opacity:.75; pointer-events:none; animation:pulseLine 1.2s ease-in-out infinite; text-shadow:0 0 14px #8e44ad; }
  .destroyMark { position:absolute; z-index:35; display:flex; align-items:center; justify-content:center; font-size:60px; pointer-events:none; animation:pulseLine 1s ease-in-out infinite; filter:drop-shadow(0 0 10px #e67e22); }

  .enemy { position:absolute; border-radius:10px; transition:left .3s ease,top .3s ease; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .enemy img { width:96px; height:96px; image-rendering:pixelated; filter:drop-shadow(0 4px 6px #000a); }
  .enemy .estat { display:flex; gap:6px; margin-top:2px; font-size:16px; font-weight:bold; color:#fff; text-shadow:0 1px 2px #000; }
  .enemy .eatk{ color:#ff9a6a; } .enemy .ehpn{ color:#8affa0; }
  .enemy .ehp { width:120px; height:14px; background:#4a0d0d; border:2px solid #000; border-radius:7px; margin-top:1px; position:relative; overflow:hidden; }
  .enemy .ehpfill { height:100%; background:linear-gradient(#ff5a5a,#a01818); transition:width .2s; }
  .enemy .estun { position:absolute; top:-6px; right:4px; font-size:28px; display:none; filter:drop-shadow(0 0 6px #ffec5a); }
  .enemy.stunned .estun{ display:block; animation:intentPulse 1s infinite; }
  .enemy.stunned img{ filter:grayscale(.6) brightness(.8) drop-shadow(0 4px 6px #000a); }

  #colStats { position:absolute; left:50%; transform:translateX(-50%); z-index:8; display:flex; }
  .colStat { text-align:center; font-size:26px; font-weight:900; text-shadow:0 2px 3px #000; color:#7ec8ff; }
  @keyframes defHit{ 0%{transform:scale(1);color:#7ec8ff;} 30%{transform:scale(1.5);color:#fff;} 100%{transform:scale(1);color:#7ec8ff;} }
  .colStat.defhit{ animation:defHit .4s; }
  @keyframes defGain{ 0%{transform:scale(1);color:#7ec8ff;} 30%{transform:scale(1.6);color:#aef;} 100%{transform:scale(1);color:#7ec8ff;} }
  .colStat.defgain{ animation:defGain .4s; }

  #boardWrap { position:absolute; left:50%; transform:translateX(-50%); }
  #board { position:relative; background:#241c14; border:4px solid #120d08; border-radius:16px; }
  .bslot { position:absolute; background:#2e2519; border:2px solid #3d3020; border-radius:10px; transition:background .12s,border-color .12s,box-shadow .12s; }
  .bslot.valid { background:#3f6a2e; border:3px solid #9cff5a; box-shadow:inset 0 0 20px #9cff5aaa, 0 0 12px #9cff5a88; }
  .bslot.hover { background:#7cc44a; border-color:#eaffce; box-shadow:inset 0 0 26px #dfffb0, 0 0 20px #aef58c; }
  .fcard { position:absolute; border-radius:10px; transition:left .16s ease,top .16s ease; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(#efe6d6,#d9c9a8); border:4px solid #b89b6a; z-index:5; }
  .fcard.atk { border-color:#c0392b; background:linear-gradient(#f3d9d2,#e0b3a8); }
  .fcard.def { border-color:#2980b9; background:linear-gradient(#d2e2f3,#a8c6e0); }
  .fcard .ficon { width:52px; height:52px; }
  .fcard .fval { position:absolute; top:-10px; left:-10px; min-width:42px; height:42px; padding:0 4px; border-radius:21px; background:radial-gradient(#fff,#d8c088); color:#111; font-size:22px; font-weight:900; display:flex; align-items:center; justify-content:center; border:3px solid #0007; }
  @keyframes spawnGrow{ 0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .fcard.spawning{ animation:spawnGrow .28s ease-out; }
  @keyframes mergePunch{ 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .fcard.merged{ animation:mergePunch .25s ease-out; z-index:12; }

  @keyframes hitShake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-8px,4px);} 40%{transform:translate(8px,-4px);} 60%{transform:translate(-6px,2px);} 80%{transform:translate(6px,-2px);} }
  .hurt { animation:hitShake .3s; }
  .hurt img { filter:drop-shadow(0 0 10px #f00) brightness(1.8) sepia(1) hue-rotate(-40deg) saturate(6) !important; }
  @keyframes punch { 0%{transform:scale(1);} 45%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .punch { animation:punch .25s ease-out; z-index:15; }
  .slash { position:absolute; pointer-events:none; z-index:30; overflow:hidden; }
  .slash::after { content:""; position:absolute; top:50%; left:-40%; width:180%; height:9px; background:linear-gradient(90deg,transparent,#fff,transparent); transform:translateY(-50%) rotate(-30deg); animation:slashGo .3s ease-out forwards; box-shadow:0 0 14px #fff; }
  @keyframes slashGo { from{opacity:0; transform:translate(-40px,26px) rotate(-30deg);} 30%{opacity:1;} to{opacity:0; transform:translate(40px,-26px) rotate(-30deg);} }
  @keyframes destroyFx { 0%{opacity:1;transform:scale(1) rotate(0);} 100%{opacity:0;transform:scale(1.4) rotate(20deg);} }
  .destroying { animation:destroyFx .4s ease-out forwards; filter:brightness(2) sepia(1) hue-rotate(-30deg) saturate(4); }

  #handZone { position:absolute; bottom:0; left:0; width:100%; height:470px; z-index:18; }
  #hpBadge,#manaBadge { position:absolute; bottom:22px; width:135px; height:135px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:30px; font-weight:bold; color:#fff; text-shadow:0 2px 3px #000; border:5px solid #0008; z-index:25; }
  #hpBadge { left:22px; background:radial-gradient(circle at 40% 35%,#ff6b6b,#8b0000); }
  #manaBadge { right:22px; background:radial-gradient(circle at 40% 35%,#5aa0ff,#0a2a7a); }
  #manaBadge #manaText{ font-size:26px; }
  .badgeLabel { font-size:18px; opacity:.85; }
  #endTurnBtn { position:absolute; bottom:170px; right:22px; width:175px; height:76px; background:linear-gradient(#ffd166,#e0a020); border:4px solid #7a5a10; border-radius:16px; color:#3a2a00; font-size:26px; font-weight:900; z-index:26; box-shadow:0 5px 0 #7a5a10; display:flex; align-items:center; justify-content:center; }
  #endTurnBtn:active { transform:translateY(4px); box-shadow:0 1px 0 #7a5a10; }
  #deckPile { position:absolute; bottom:22px; right:170px; width:82px; height:108px; background:#2a2440; border:3px solid #5a5480; border-radius:10px; color:#ccc; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; z-index:22; }
  @keyframes blockPulse{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }

  #hand { position:absolute; bottom:0; left:0; width:100%; height:300px; z-index:19; pointer-events:none; }
  .hcard { position:absolute; left:50%; bottom:-30px; width:150px; height:215px; margin-left:-75px;
    background:linear-gradient(#efe6d6,#d9c9a8); border:4px solid #b89b6a; border-radius:14px; box-shadow:0 6px 14px #000a;
    display:flex; flex-direction:column; align-items:center; padding:8px 6px;
    transform-origin:center 340px; pointer-events:auto; cursor:grab;
    transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s; }
  .hcard.atk{border-color:#c0392b;} .hcard.def{border-color:#2980b9;} .hcard.skill{border-color:#7a5aa8;}
  .hcard .hcost{ position:absolute; top:-12px; left:-12px; width:46px; height:46px; border-radius:50%; background:radial-gradient(#7fc0ff,#1a5ec0); color:#fff; font-size:22px; font-weight:bold; display:flex; align-items:center; justify-content:center; border:3px solid #fff8; }
  .hcard .htier{ position:absolute; top:-12px; right:-10px; background:#3a2d18; color:#ffd166; font-size:15px; font-weight:bold; padding:3px 8px; border-radius:10px; border:2px solid #0007; }
  .hcard .htier.skill{ background:#3a2848; color:#d8b6ff; }
  .hcard .hicon{ width:58px; height:58px; margin-top:10px; }
  .hcard .hname{ font-size:19px; font-weight:bold; color:#3a2d18; margin-top:5px; text-align:center; line-height:1.1; }
  .hcard .hdesc{ font-size:11px; color:#5a4a30; text-align:center; margin-top:4px; line-height:1.2; }
  .hcard .hkw{ position:absolute; bottom:4px; font-size:10px; color:#7a3010; font-weight:bold; }
  .hcard.unaffordable{ filter:grayscale(.6) brightness(.75); }
  .hcard.dragging{ transition:none !important; z-index:200; cursor:grabbing; box-shadow:0 14px 30px #000c; }
  .hcard.zoomed{ transition:transform .2s ease !important; z-index:400 !important;
    transform:translate(-50%,-60%) scale(2.1) !important; left:540px !important; bottom:auto !important; top:820px !important; }
  .hcard.zoomed .hdesc{ font-size:14px; }
  .hcard.zoomed .hname{ font-size:24px; }
  #zoomDim{ position:absolute; inset:0; background:#000a; z-index:390; display:none; pointer-events:none; }
  #zoomDim.on{ display:block; }

  .dmgPop{ position:absolute; font-size:38px; font-weight:900; color:#ffde59; text-shadow:0 2px 4px #000,0 0 8px #f80; pointer-events:none; z-index:40; animation:popUp .8s ease-out forwards; }
  @keyframes popUp{ 0%{opacity:1; transform:translateY(0) scale(.6);} 30%{transform:translateY(-20px) scale(1.2);} 100%{opacity:0; transform:translateY(-80px) scale(1);} }
  #centerDmg{ position:absolute; top:820px; left:0; width:100%; text-align:center; z-index:55; pointer-events:none; }
  #centerDmg span{ display:inline-block; font-size:110px; font-weight:900; color:#ff3030; text-shadow:0 4px 10px #000,0 0 20px #f00; opacity:0; }
  #centerDmg.show span{ animation:centerDmgFx 1s ease-out; }
  @keyframes centerDmgFx{ 0%{opacity:0;transform:scale(2.2);} 20%{opacity:1;transform:scale(1);} 75%{opacity:1;} 100%{opacity:0;transform:scale(1.1);} }
  #redFlash{ position:absolute; inset:0; background:#f00; opacity:0; pointer-events:none; z-index:50; }
  #redFlash.on{ animation:flashRed .45s; }
  @keyframes flashRed{ 0%{opacity:0;} 30%{opacity:.5;} 100%{opacity:0;} }
  #banner{ position:absolute; top:900px; width:100%; text-align:center; z-index:60; pointer-events:none; }
  #banner span{ display:inline-block; font-size:60px; font-weight:900; color:#fff; text-shadow:0 4px 8px #000; opacity:0; }
  #banner.show span{ animation:bannerPop 1.2s ease-out; }
  @keyframes bannerPop{ 0%{opacity:0; transform:scale(2);} 20%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;} }

  #archSelect{ position:absolute; inset:0; z-index:600; background:#0d0a14ee; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; }
  #archSelect h1{ color:#ffd166; font-size:60px; text-shadow:0 4px 8px #000; }
  #archSelect p{ color:#bbb; font-size:26px; }
  .archRow{ display:flex; gap:40px; }
  .archCard{ width:300px; height:440px; background:linear-gradient(#2a2440,#1a1630); border:5px solid #6a5a8a; border-radius:20px; padding:24px; color:#eee; cursor:pointer; box-shadow:0 8px 20px #000a; transition:transform .15s,border-color .15s; }
  .archCard:active{ transform:scale(.97); }
  .archCard:hover{ border-color:#ffd166; }
  .archCard .aTitle{ font-size:40px; font-weight:900; text-align:center; margin-bottom:16px; }
  .archCard.str .aTitle{ color:#ff9a5a; } .archCard.def .aTitle{ color:#5ab0ff; }
  .archCard .aIcon{ font-size:80px; text-align:center; margin:10px 0 20px; }
  .archCard .aDesc{ font-size:20px; line-height:1.5; color:#cfc9dd; }

  #loadMsg{ position:absolute; inset:0; z-index:700; background:#0d0a14; display:flex; align-items:center; justify-content:center;
    color:#eee; font-size:26px; text-align:center; padding:40px; line-height:1.6; }
  #loadMsg.hidden{ display:none; }
  #loadMsg b{ color:#ffd166; }
  #loadMsg code{ background:#241d33; padding:2px 8px; border-radius:6px; color:#9cff5a; }
</style>
</head>
<body>
<div id="stage"><div id="game">
  <div id="topbar">
    <div id="bossName">보스 · <b id="bossTitle">불타는 군주</b> <span id="phaseTag">[1페이즈]</span></div>
    <div id="bossHpBar"><div id="bossHpFill"></div><div id="bossHpText"></div></div>
    <div id="bossStun">😵‍💫</div>
    <div id="bossIntent"><span class="iIcon"></span><span class="iVal"></span></div>
  </div>

  <div id="bossArt"><img id="bossImg" src="" alt="boss"></div>
  <div id="strBadge">💪<span id="strText">0</span></div>
  <div id="buffBar"></div>
  <div id="buffTip"></div>

  <div id="fieldWrap"><div id="field"></div></div>
  <div id="colStats"></div>
  <div id="boardWrap"><div id="board"></div></div>

  <div id="handZone">
    <div id="hpBadge"><span class="badgeLabel">HP</span><span id="hpText">30/30</span></div>
    <div id="manaBadge"><span class="badgeLabel">마나</span><span id="manaText">12/12</span></div>
    <div id="endTurnBtn">턴 종료</div>
    <div id="deckPile">덱<br><span id="deckCount">30</span></div>
  </div>
  <div id="zoomDim"></div>
  <div id="hand"></div>

  <div id="banner"><span id="bannerText"></span></div>
  <div id="centerDmg"><span id="centerDmgText"></span></div>
  <div id="redFlash"></div>

  <div id="archSelect">
    <h1>덱을 선택하세요</h1>
    <p>아키타입에 맞는 30장 고정 덱이 구성됩니다</p>
    <div class="archRow" id="archRow"></div>
  </div>

  <div id="loadMsg">카드 데이터를 불러오는 중…</div>
</div></div>

<script>
/* ===== 제스처 차단 ===== */
document.addEventListener("touchstart", e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener("touchmove",  e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener("gesturestart",  e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
document.addEventListener("gestureend",    e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener("touchend", e=>{ const now=Date.now(); if(now-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=now; }, {passive:false});
document.addEventListener("dblclick", e=>e.preventDefault());
document.addEventListener("selectstart", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("wheel", e=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});

/* ===== 리소스 ===== */
const MON="https://raw.githubusercontent.com/crawl/tiles/master/releases/Ancient/Oct-5-2010/dc-mon/";
const IC="https://raw.githubusercontent.com/game-icons/icons/master/";
const BOSS_IMG=MON+"dragon.png";
const SWORD=IC+"lorc/pointy-sword.svg";
const SHIELD=IC+"sbed/shield.svg";
const MON_FILES=["kobold.png","ogre.png","ooze.png","necromancer.png","naga.png","manticore.png","minotaur.png","cyclops.png"];
const SUMMON_ATK=10, SUMMON_HP=30, BOSS_ATK=20;
const BOSS_BASE_HP=100, MAX_PHASE=4;
const SLIDE_COST=2;
const MERGE_CAP=16;   /* 슬라이드 병합 상한 */

/* ===== 카드/덱: JSON에서 로드 ===== */
let CARDS={}, DECKS={};
function cardCost(def){ return def.cost; }
function coverNeed(def){ return def.coverNeed; }
function hasKW(def,kw){ return def.kw && def.kw.includes(kw); }
function iconURL(def){ return IC+def.icon; }

/* ===== 데이터 로딩 ===== */
async function loadData(){
  const [cardsRes, deckRes] = await Promise.all([
    fetch("./assets/cards.json",{cache:"no-store"}),
    fetch("./assets/template_deck.json",{cache:"no-store"})
  ]);
  if(!cardsRes.ok) throw new Error("cards.json HTTP "+cardsRes.status);
  if(!deckRes.ok)  throw new Error("template_deck.json HTTP "+deckRes.status);
  const cardsData=await cardsRes.json();
  const deckData=await deckRes.json();
  CARDS=cardsData.cards||{};
  DECKS=deckData.decks||{};
  for(const k in CARDS){
    const c=CARDS[k];
    if(!c.kw) c.kw=[];
    if(c.placesTile===undefined) c.placesTile = (c.type!=="skill");
    if(c.destroysCover===undefined) c.destroysCover = (c.type==="skill");
    if(c.coverNeed===undefined) c.coverNeed = c.cost;
    if(c.tile===undefined) c.tile = c.placesTile ? c.cost*2 : 0;
    if(c.exhaust===undefined) c.exhaust=false;
  }
}
function showLoadError(err){
  const el=document.getElementById("loadMsg");
  el.classList.remove("hidden");
  el.innerHTML=
    `<div><b>데이터를 불러오지 못했습니다.</b><br><br>`+
    `<code>./assets/cards.json</code> 또는 <code>./assets/template_deck.json</code> 을 찾을 수 없거나 로컬 파일 접근이 차단되었습니다.<br><br>`+
    `<code>file://</code>로 직접 열면 보안 정책상 JSON을 불러올 수 없습니다. 로컬 서버로 실행하세요:<br><br>`+
    `<code>python -m http.server</code><br>→ <code>http://localhost:8000/game.html</code><br><br>`+
    `<span style="color:#ff8a5a;font-size:20px">(${(err&&err.message)||err})</span></div>`;
}

/* ===== 그리드 ===== */
const FCOLS=4, FROWS=2, BCOLS=4, BROWS=4, CELL=140;
const bx=c=>16+c*(CELL+16), by=r=>16+r*(CELL+16);
const fx=c=>16+c*(CELL+16), fy=r=>16+r*(CELL+16);
const BOARD_W=CELL*BCOLS+16*(BCOLS+1), BOARD_H=CELL*BROWS+16*(BROWS+1);
const FIELD_W=CELL*FCOLS+16*(FCOLS+1), FIELD_H=CELL*FROWS+16*(FROWS+1);

/* ===== 상태 ===== */
let field,board,deck,hand,discard,exhaustPile,mana,maxMana,hp,maxHp,bossHp,bossMax,turnCount,
    colDef,busy,bossIntent,bossStun,strength,tempStrMult,thornsOn,blockedThisTurn,chosenArch,phase;
const gameEl=document.getElementById("game"),
      fieldEl=document.getElementById("field"), boardEl=document.getElementById("board"),
      handEl=document.getElementById("hand"), colStatsEl=document.getElementById("colStats"),
      bossIntentEl=document.getElementById("bossIntent"), buffBarEl=document.getElementById("buffBar"),
      buffTipEl=document.getElementById("buffTip");

function resize(){ const s=Math.min(innerWidth/1080,innerHeight/1920); document.getElementById("stage").style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",resize); resize();
function stageScale(){ return Math.min(innerWidth/1080,innerHeight/1920); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ===== 덱 구성 (템플릿 기반) ===== */
function buildDeck(arch){
  const t=DECKS[arch]; const d=[];
  (t.cards||[]).forEach(entry=>{ const n=entry.count||1; for(let i=0;i<n;i++) d.push(entry.id); });
  shuffle(d);
  return d;
}

/* ===== 아키타입 선택 ===== */
function initArchSelect(){
  const row=document.getElementById("archRow"); row.innerHTML="";
  for(const key in DECKS){
    const t=DECKS[key];
    const el=document.createElement("div");
    el.className="archCard "+key; el.dataset.arch=key;
    el.innerHTML=`<div class="aTitle">${t.label||key}</div><div class="aIcon">${t.icon||"🎴"}</div><div class="aDesc">${t.desc||""}</div>`;
    el.addEventListener("click",()=>{ chosenArch=key; document.getElementById("archSelect").style.display="none"; newGame(); });
    row.appendChild(el);
  }
}

/* ===== 게임 시작 ===== */
function newGame(){
  field=Array.from({length:FROWS},()=>Array(FCOLS).fill(null));
  board=Array.from({length:BROWS},()=>Array(BCOLS).fill(null));
  deck=buildDeck(chosenArch); hand=[]; discard=[]; exhaustPile=[];
  hp=30; maxHp=30; phase=1; bossMax=BOSS_BASE_HP*phase; bossHp=bossMax;
  turnCount=0; colDef=Array(BCOLS).fill(0);
  busy=false; bossIntent=null; bossStun=0;
  strength=0; tempStrMult=1; thornsOn=false; blockedThisTurn=0;
  document.getElementById("bossImg").src=BOSS_IMG;
  updatePhaseTag();
  buildSlots();
  for(let c=0;c<FCOLS;c++) if(Math.random()<0.5) spawnAt(0,c,true);
  renderAll(); startTurn();
}
function updatePhaseTag(){ document.getElementById("phaseTag").textContent=`[${phase}페이즈]`; }
function buildSlots(){
  fieldEl.style.width=FIELD_W+"px"; fieldEl.style.height=FIELD_H+"px";
  boardEl.style.width=BOARD_W+"px"; boardEl.style.height=BOARD_H+"px";
  fieldEl.innerHTML=""; boardEl.innerHTML="";
  for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++){
    const f=document.createElement("div"); f.className="fslot";
    f.style.left=fx(c)+"px"; f.style.top=fy(r)+"px"; f.style.width=CELL+"px"; f.style.height=CELL+"px";
    fieldEl.appendChild(f);
  }
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){
    const b=document.createElement("div"); b.className="bslot"; b.dataset.r=r; b.dataset.c=c;
    b.style.left=bx(c)+"px"; b.style.top=by(r)+"px"; b.style.width=CELL+"px"; b.style.height=CELL+"px";
    boardEl.appendChild(b);
  }
  document.getElementById("fieldWrap").style.top="440px";
  const boardTop=440+FIELD_H+70;
  document.getElementById("boardWrap").style.top=boardTop+"px";
  colStatsEl.style.top=(boardTop-52)+"px"; colStatsEl.style.width=BOARD_W+"px"; colStatsEl.innerHTML="";
  for(let c=0;c<BCOLS;c++){ const d=document.createElement("div"); d.className="colStat"; d.style.width=(CELL+16)+"px"; d.style.marginLeft=(c===0?16:0)+"px"; colStatsEl.appendChild(d); }
}

/* ===== 렌더 ===== */
function renderAll(){ renderEnemies(); renderCards(); renderColStats(); updateHUD(); renderStrBadge(); renderBuffs(); renderBossIntent(); renderBossStun(); }
const manaText=document.getElementById("manaText"),hpText=document.getElementById("hpText"),
 deckCount=document.getElementById("deckCount"),bossHpFill=document.getElementById("bossHpFill"),
 bossHpText=document.getElementById("bossHpText"),
 strBadge=document.getElementById("strBadge"),strText=document.getElementById("strText"),bossStunEl=document.getElementById("bossStun");
function updateHUD(){
  manaText.textContent=`${mana}/${maxMana}`; hpText.textContent=`${Math.max(0,hp)}/${maxHp}`;
  deckCount.textContent=deck.length;
  bossHpFill.style.width=Math.max(0,bossHp/bossMax*100)+"%";
  bossHpText.textContent=`${Math.max(0,bossHp)} / ${bossMax}`;
  hand.forEach(c=>c.el.classList.toggle("unaffordable",+c.el.dataset.cost>mana));
}
function renderStrBadge(bump){
  strText.textContent=strength; strBadge.classList.toggle("show", strength!==0);
  if(bump && strength!==0){ strBadge.classList.remove("bump"); void strBadge.offsetWidth; strBadge.classList.add("bump"); }
}
/* 지속효과(버프) */
function activeBuffs(){
  const list=[];
  if(thornsOn) list.push({icon:"🌵", name:"가시", tip:"<b>가시</b><br>이번 턴에 방어력으로 막아낸 데미지만큼 보스에게 반사합니다. (턴 종료 시 해제)"});
  if(tempStrMult>1) list.push({icon:"⚡", name:"압도적인힘", tip:"<b>압도적인힘</b><br>이번 턴 동안 힘 효과가 2배로 적용됩니다. (턴 종료 시 해제)"});
  return list;
}
function renderBuffs(bump){
  const buffs=activeBuffs();
  buffBarEl.innerHTML="";
  buffs.forEach(b=>{
    const chip=document.createElement("div"); chip.className="buffChip"; chip.textContent=b.icon;
    chip.addEventListener("click",ev=>{ ev.stopPropagation(); showBuffTip(chip,b.tip); });
    buffBarEl.appendChild(chip);
    if(bump){ chip.classList.remove("bump"); void chip.offsetWidth; chip.classList.add("bump"); }
  });
  if(!buffs.length) hideBuffTip();
}
function showBuffTip(anchor,html){
  buffTipEl.innerHTML=html; buffTipEl.classList.add("on");
  const r=anchor.getBoundingClientRect(), s=stageScale(), st=document.getElementById("stage").getBoundingClientRect();
  buffTipEl.style.left=((r.right-st.left)/s+12)+"px";
  buffTipEl.style.top=((r.top-st.top)/s)+"px";
}
function hideBuffTip(){ buffTipEl.classList.remove("on"); }
document.addEventListener("click",e=>{ if(!e.target.closest(".buffChip")) hideBuffTip(); });
function renderBossStun(){ bossStunEl.classList.toggle("on", bossStun>0); }
function colDefTotal(c){ return colDef[c]; }
function renderColStats(){ for(let c=0;c<BCOLS;c++){ colStatsEl.children[c].textContent=`🛡${colDefTotal(c)}`; } }
function renderEnemies(){
  for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++){
    const e=field[r][c]; if(!e)continue;
    if(!e.el){ const d=document.createElement("div"); d.className="enemy"; d.style.width=CELL+"px"; d.style.height=CELL+"px";
      d.innerHTML=`<div class="estun">😵</div><img src="${MON+e.file}" onerror="this.style.background='#c0392b'">
        <div class="estat"><span class="eatk">🗡${e.atk}</span><span class="ehpn"></span></div>
        <div class="ehp"><div class="ehpfill"></div></div>`;
      fieldEl.appendChild(d); e.el=d; }
    e.el.style.left=fx(c)+"px"; e.el.style.top=fy(r)+"px";
    e.el.classList.toggle("stunned", e.stun>0);
    e.el.querySelector(".ehpfill").style.width=Math.max(0,e.hp/e.maxHp*100)+"%";
    e.el.querySelector(".ehpn").textContent="❤"+Math.max(0,e.hp);
  }
}
function renderCards(){
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){
    const f=board[r][c]; if(!f)continue;
    if(!f.el){ const d=document.createElement("div"); d.className="fcard "+f.type; d.style.width=CELL+"px"; d.style.height=CELL+"px";
      d.innerHTML=`<div class="fval">${f.val}</div><img class="ficon" src="${f.type==='atk'?SWORD:SHIELD}" style="filter:drop-shadow(0 0 3px #0008)" onerror="this.style.background='#888'">`;
      boardEl.appendChild(d); f.el=d;
    } else { f.el.querySelector(".fval").textContent=f.val; f.el.className="fcard "+f.type; f.el.querySelector(".ficon").src=f.type==='atk'?SWORD:SHIELD; }
    f.el.style.left=bx(c)+"px"; f.el.style.top=by(r)+"px";
  }
}

/* ===== 힘 계산 ===== */
function effStrength(mult){ return strength*tempStrMult*(mult||1); }

/* ===== 턴 ===== */
function startTurn(){
  turnCount++;
  colDef=Array(BCOLS).fill(0);          /* 방어력 매 턴 리셋 */
  thornsOn=false; blockedThisTurn=0; tempStrMult=1;
  maxMana=Math.min(40,12+(turnCount-1)*4); mana=maxMana;
  spawnBoardTile();
  decideBossIntent();
  renderCards(); renderColStats(); renderStrBadge(); renderBuffs(); updateHUD();
  drawCards(5);
}
document.getElementById("endTurnBtn").addEventListener("click",endTurn);
async function endTurn(){
  if(busy)return; busy=true; hideBossIntent(); hideBuffTip();
  await defenseResolve();
  await playerColumnResolve();
  if(bossHp<=0){ await nextPhaseOrWin(); if(phase>MAX_PHASE){ busy=false; return; } }
  refreshDestroyTarget(); clearBossMarks();
  await discardHand();
  await enemyPhase();
  if(hp<=0){ lose(); busy=false; return; }
  startTurn(); busy=false;
}
/* 배치된 방어 타일 발동 → 해당 열 방어력 += 타일 값 */
async function defenseResolve(){
  for(let c=0;c<BCOLS;c++){
    for(let r=0;r<BROWS;r++){
      const f=board[r][c];
      if(f&&f.type==="def"){
        punch(f.el); colDef[c]+=f.val; defGainAnim(c); dmgPop(f.el,"+"+f.val+"🛡","#7ec8ff");
        renderColStats(); await sleep(180);
      }
    }
  }
}
/* 배치된 공격 타일 발동 → 해당 열에 데미지 */
async function playerColumnResolve(){
  for(let c=0;c<BCOLS;c++){
    for(let r=BROWS-1;r>=0;r--){
      const f=board[r][c];
      if(f&&f.type==="atk"){ punch(f.el); await sleep(140); dealToColumn(c, f.val + effStrength()); await sleep(180); if(bossHp<=0) return; }
    }
  }
}
function spawnBoardTile(){
  const empties=[]; for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++) if(!board[r][c]) empties.push([r,c]);
  if(!empties.length) return null;
  const [r,c]=empties[Math.random()*empties.length|0];
  board[r][c]={type:Math.random()<0.5?"atk":"def",val:2,el:null};
  return [r,c];
}

/* ===== 페이즈 전환 ===== */
async function nextPhaseOrWin(){
  if(phase>=MAX_PHASE){ win(); phase=MAX_PHASE+1; return; }
  phase++;
  showBanner(phase+"페이즈!");
  await sleep(900);
  bossMax=BOSS_BASE_HP*phase; bossHp=bossMax;
  bossStun=0; renderBossStun();
  updatePhaseTag(); updateHUD();
  decideBossIntent();
  await sleep(300);
}

/* ===== 부채꼴 손패 ===== */
function layoutHand(){
  const n=hand.length; if(n===0) return;
  const centerX=540, baseBottom=-30;
  const spread=Math.min(90, 620/Math.max(1,n));
  const maxAngle=Math.min(8, 26/Math.max(1,n));
  hand.forEach((h,i)=>{
    if(h.el.classList.contains("dragging")||h.el.classList.contains("zoomed")) return;
    const mid=(n-1)/2, off=i-mid;
    const x=centerX + off*spread, angle=off*maxAngle, lift=Math.abs(off)*Math.abs(off)*4;
    h.el.style.transition="transform .3s cubic-bezier(.2,.8,.3,1),left .3s,bottom .3s,opacity .3s";
    h.el.style.left=x+"px"; h.el.style.bottom=(baseBottom - lift + 60)+"px";
    h.el.style.transform=`translateX(-75px) rotate(${angle}deg)`; h.el.style.zIndex=100+i; h.el.style.opacity="1";
  });
}
async function drawCards(n){
  for(let i=0;i<n;i++){
    if(hand.length>=10) break;
    if(deck.length===0){ deck=discard.slice(); discard=[]; shuffle(deck); }
    if(deck.length===0) break;
    await drawOne(deck.pop());
  }
  layoutHand(); updateHUD();
}
function drawOne(key){
  return new Promise(res=>{
    const def=CARDS[key], cost=cardCost(def), el=document.createElement("div");
    el.className="hcard "+def.type; el.dataset.cost=cost; el.dataset.key=key;
    el.style.left="900px"; el.style.bottom="-260px"; el.style.opacity="0"; el.style.transform="translateX(-75px)";
    const kwStr = def.kw && def.kw.length ? def.kw.join(" · ") : "";
    const tierLabel = def.type==="skill" ? "스킬" : def.tile;
    const tierCls = def.type==="skill" ? "htier skill" : "htier";
    const fallbackIcon = def.type==="def" ? SHIELD : SWORD;
    el.innerHTML=`<div class="hcost">${cost}</div><div class="${tierCls}">${tierLabel}</div>
      <img class="hicon" src="${iconURL(def)}" style="filter:drop-shadow(0 0 2px #000)" onerror="this.src='${fallbackIcon}'">
      <div class="hname">${def.name}</div><div class="hdesc">${(def.desc||"").replace(/\n/g,"<br>")}</div>
      ${kwStr?`<div class="hkw">${kwStr}</div>`:""}`;
    handEl.appendChild(el);
    const card={key,def,el}; el.__card=card; hand.push(card);
    attachDrag(card);
    requestAnimationFrame(()=>{ layoutHand(); });
    updateHUD(); setTimeout(res,110);
  });
}
async function discardHand(){
  const copy=hand.slice(); hand.length=0;
  const proms=copy.map(c=>{ discard.push(c.key);
    c.el.style.transition="transform .38s,opacity .38s,bottom .38s";
    c.el.style.bottom="640px"; c.el.style.opacity="0"; c.el.style.transform="translateX(-75px) rotate(25deg) scale(.6)";
    return new Promise(r=>setTimeout(()=>{c.el.remove();r();},400)); });
  await Promise.all(proms);
}

/* ===== 드래그 소환 + 홀드 확대 ===== */
function attachDrag(card){
  const el=card.el; let ox,oy,dragging=false,holdTimer=null,zoomed=false,startP=null;
  const dim=document.getElementById("zoomDim");
  function pt(e){ return e.touches&&e.touches[0]?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
  function clearHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
  function armHold(){ clearHold(); holdTimer=setTimeout(()=>{ if(dragging){ el.classList.remove("dragging"); highlightValid(card,false); zoomIn(); } },3000); }
  function zoomIn(){ zoomed=true; el.classList.add("zoomed"); dim.classList.add("on"); }
  function zoomOut(){ if(!zoomed) return; zoomed=false; el.classList.remove("zoomed"); dim.classList.remove("on"); }
  function beginDragVisual(){ el.style.transition="none"; el.classList.add("dragging"); el.style.transform="translateX(-75px)"; ox=75; oy=100; }
  function down(e){
    if(busy) return;
    if(+el.dataset.cost>mana){ flashBadge("manaBadge"); return; }
    dragging=true; startP=pt(e);
    beginDragVisual();
    const s=stageScale(), st=document.getElementById("stage").getBoundingClientRect();
    setPos(pt(e),s,st); highlightValid(card,true); e.preventDefault();
    armHold();
  }
  function setPos(p,s,st){
    const lx=(p.x-st.left)/s, ly=(p.y-st.top)/s;
    el.style.left=lx+"px"; el.style.bottom=(1920 - ly - (215-oy))+"px"; el.style.transform="translateX(-75px)";
    const slot=slotUnder(p.x,p.y);
    boardEl.querySelectorAll(".bslot").forEach(b=>b.classList.toggle("hover", !!(slot&&b.classList.contains("valid")&&+b.dataset.r===slot.r&&+b.dataset.c===slot.c)));
  }
  function move(e){
    if(!dragging)return;
    const p=pt(e);
    if(startP){ const d=Math.hypot(p.x-startP.x,p.y-startP.y);
      if(d>14){ startP=p;
        if(zoomed){ zoomOut(); beginDragVisual(); highlightValid(card,true); }
        armHold();
      } }
    if(zoomed){ if(e.cancelable)e.preventDefault(); return; }
    const s=stageScale(), st=document.getElementById("stage").getBoundingClientRect(); setPos(p,s,st);
    if(e.cancelable)e.preventDefault();
  }
  function up(e){
    if(!dragging)return; dragging=false; clearHold();
    el.classList.remove("dragging");
    const wasZoomed=zoomed; zoomOut(); highlightValid(card,false);
    if(wasZoomed){ layoutHand(); return; }
    const p=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:{x:e.clientX,y:e.clientY};
    const slot=slotUnder(p.x,p.y);
    if(slot && canPlace(card,slot.r,slot.c)) doPlace(card,slot.r,slot.c);
    else layoutHand();
  }
  el.addEventListener("mousedown",down); addEventListener("mousemove",move); addEventListener("mouseup",up);
  el.addEventListener("touchstart",down,{passive:false}); addEventListener("touchmove",move,{passive:false}); addEventListener("touchend",up);
}
function slotUnder(px,py){
  const s=stageScale(), bw=boardEl.getBoundingClientRect();
  const lx=(px-bw.left)/s, ly=(py-bw.top)/s;
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++)
    if(lx>=bx(c)&&lx<=bx(c)+CELL&&ly>=by(r)&&ly<=by(r)+CELL) return {r,c};
  return null;
}
/* 모든 카드는 coverNeed 값과 같은 타일 위에만 놓을 수 있음(공/방 무관) */
function canPlace(card,r,c){
  const t=board[r][c]; const need=coverNeed(card.def);
  return !!(t && t.val===need);
}
function highlightValid(card,on){
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){
    const slot=boardEl.querySelector(`.bslot[data-r="${r}"][data-c="${c}"]`);
    slot.classList.toggle("valid", on&&canPlace(card,r,c)); if(!on)slot.classList.remove("hover");
  }
}
function doPlace(card,r,c){
  const cost=+card.el.dataset.cost;
  if(mana<cost){ layoutHand(); return; }
  mana-=cost;
  const i=hand.indexOf(card); if(i>=0) hand.splice(i,1);
  if(card.def.exhaust) exhaustPile.push(card.key); else discard.push(card.key);
  card.el.remove(); layoutHand();
  applyPlaceEffect(card.def,r,c,board[r][c]);
  updateHUD();
}

/* ===== 배치 효과 =====
   공/방: 즉발 효과 실행 → 덮은 타일 제거 후 2N 타일 배치
   스킬: 즉발 효과 실행 → 덮은 타일 파괴(배치 없음) */
function applyPlaceEffect(def,r,c,covered){
  const key=Object.keys(CARDS).find(k=>CARDS[k]===def);
  if(def.placesTile){
    if(covered && covered.el) covered.el.remove();
    board[r][c]={type:(def.type==="def"?"def":"atk"),val:def.tile,el:null};
    renderCards();
    const nc=board[r][c];
    if(nc&&nc.el){ nc.el.classList.add("spawning"); setTimeout(()=>nc.el&&nc.el.classList.remove("spawning"),300); if(hasKW(def,"타격")||def.type==="atk") punch(nc.el); }
    runCardEffect(key,def,r,c);
  } else {
    /* 스킬: 즉발 먼저, 그 다음 덮은 타일 파괴 */
    runCardEffect(key,def,r,c);
    if(def.destroysCover) destroyCard(r,c);
  }
  renderCards(); renderColStats(); renderStrBadge(); renderBuffs(true); renderEnemies();
  refreshDestroyTarget();
}

/* ===== 카드 효과: ops 인터프리터 + custom 핸들러 ===== */
function runCardEffect(key,def,r,c){
  const eff=def.effect;
  if(!eff){ return; }
  if(eff.type==="simple"){ runOps(eff.ops||[], key, def, r, c); }
  else if(eff.type==="custom"){ runCustom(eff.handler, key, def, r, c); }
}
function runOps(ops, key, def, r, c){
  for(const op of ops){
    switch(op.op){
      case "damageColumn": {
        const times=op.times||1;
        const bonus=op.useStr ? effStrength(op.strMult||1) : 0;
        for(let i=0;i<times;i++) dealToColumn(c, op.amount+bonus, op.stun?{stun:true}:undefined);
        break;
      }
      case "damageAll": {
        const bonus=op.useStr ? effStrength(op.strMult||1) : 0;
        for(let rr=0;rr<FROWS;rr++)for(let cc=0;cc<FCOLS;cc++){ if(field[rr][cc]) dealDirect(field[rr][cc], op.amount+bonus, rr, cc); }
        break;
      }
      case "addColDef": addColDef(c, op.amount); break;
      case "addAllColDef": for(let cc=0;cc<BCOLS;cc++) addColDef(cc, op.amount); break;
      case "addStrength":
        strength+=op.amount; renderStrBadge(true);
        dmgPop(strBadge,(op.amount>0?"+":"")+op.amount+"💪","#ffb56b");
        break;
      case "setTempStrMult":
        tempStrMult=op.mult; renderStrBadge(true); dmgPop(strBadge,"힘×"+op.mult,"#ffb56b");
        break;
      case "loseHp":
        hp=Math.max(0,hp-op.amount);
        if(op.flash) redFlash();
        if(op.pop) dmgPop(hpBadgeEl(),"-"+op.amount,"#ff5a5a");
        break;
      case "draw": drawCards(op.amount); break;
      default: console.warn("알 수 없는 op:", op.op); break;
    }
  }
}
function runCustom(handler, key, def, r, c){
  switch(handler){
    case "shieldbash": {
      const d=colDef[c]; colDef[c]=0; renderColStats();
      if(d>0) dealToColumn(c, d+effStrength());
      break;
    }
    case "thorns": {
      thornsOn=true; dmgPop(hpBadgeEl(),"가시","#8affa0");
      break;
    }
    default: console.warn("알 수 없는 custom 핸들러:", handler); break;
  }
}
function hpBadgeEl(){ return document.getElementById("hpBadge"); }
function addColDef(c, amt){
  if(amt>0){ colDef[c]+=amt; defGainAnim(c); dmgPop(colStatsEl.children[c],"+"+amt+"🛡","#7ec8ff"); }
  renderColStats();
}
function destroyCard(r,c){ const t=board[r][c]; if(t){ if(t.el){ t.el.classList.add("destroying"); const el=t.el; setTimeout(()=>el.remove(),400);} board[r][c]=null; } }

/* ===== 데미지 ===== */
function lowestEnemy(col){ for(let r=FROWS-1;r>=0;r--){ if(field[r][col]) return field[r][col]; } return null; }
function lowestEnemyRow(col){ for(let r=FROWS-1;r>=0;r--){ if(field[r][col]) return r; } return -1; }
function dealToColumn(col,amt,opt){
  opt=opt||{};
  let target=null,tr=-1;
  for(let r=FROWS-1;r>=0;r--){ if(field[r][col]){ target=field[r][col]; tr=r; break; } }
  if(target){
    if(amt>0){ target.hp-=amt; hurt(target.el); slashAt(fx(col),fy(tr),fieldEl); dmgPop(target.el,"-"+amt,"#ffde59"); }
    if(opt.stun){ target.stun=1; if(target.el) target.el.classList.add("stunned"); }
    if(target.hp<=0) killEnemy(target); renderEnemies();
  } else {
    if(amt>0){ bossHp-=amt; bossHurt(); dmgPop(document.getElementById("bossArt"),"-"+amt,"#ffde59"); }
    if(opt.stun){ bossStun=1; renderBossStun(); }
  }
  updateHUD();
}
function dealDirect(target,amt,r,c){
  if(!target) return;
  target.hp-=amt; hurt(target.el); slashAt(fx(c),fy(r),fieldEl); dmgPop(target.el,"-"+amt,"#ffde59");
  if(target.hp<=0) killEnemy(target); renderEnemies(); updateHUD();
}
function killEnemy(e){ for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++) if(field[r][c]===e) field[r][c]=null;
  if(e.el){ e.el.style.transition="transform .3s,opacity .3s"; e.el.style.transform="scale(0)"; e.el.style.opacity="0"; const el=e.el; setTimeout(()=>el.remove(),300);} }
function knockback(tr,c){ const e=field[tr][c]; if(e && tr>0 && !field[tr-1][c]){ field[tr-1][c]=e; field[tr][c]=null; renderEnemies(); } }

/* 플레이어 피격: 해당 열 방어력으로 흡수 후 초과분만 HP */
function applyDamageToPlayer(dmg,c){
  let remain=dmg, absorbed=0;
  const useDef=Math.min(colDef[c],remain); colDef[c]-=useDef; remain-=useDef; absorbed+=useDef;
  if(absorbed>0){ defHitAnim(c); blockedThisTurn+=absorbed; }
  renderColStats();
  if(remain>0){ hp-=remain; redFlash(); centerDmg(remain); }
  else { dmgPop(document.getElementById("hpBadge"),"방어!","#7ec8ff"); }
  if(thornsOn && absorbed>0){ bossHp-=absorbed; bossHurt(); dmgPop(document.getElementById("bossArt"),"⟳-"+absorbed,"#9cff5a"); }
  updateHUD();
}

/* ===== 적 페이즈 ===== */
async function enemyPhase(){
  showBanner("적의 턴"); await sleep(450);
  for(let c=0;c<FCOLS;c++){ const e=field[FROWS-1][c]; if(e){ if(e.stun>0){ e.stun=0; e.el&&e.el.classList.remove("stunned"); dmgPop(e.el,"기절!","#ffec5a"); await sleep(200); } else { await enemyAttack(e,c); if(hp<=0)return; } } }
  for(let c=0;c<FCOLS;c++){ const e=field[0][c]; if(e && !field[1][c]){ if(e.stun>0){ e.stun=0; e.el&&e.el.classList.remove("stunned"); } else { field[1][c]=e; field[0][c]=null; } } }
  renderEnemies(); await sleep(300);
  await bossAct(); if(hp<=0)return;
  renderEnemies(); renderColStats(); await sleep(250);
}
async function enemyAttack(e,c){ punch(e.el); applyDamageToPlayer(e.atk,c); await sleep(320); }

/* ===== 보스 인텐트 ===== */
function fieldCount(){ let n=0; for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++) if(field[r][c]) n++; return n; }
function openTopCols(){ const arr=[]; for(let c=0;c<FCOLS;c++) if(!field[0][c]) arr.push(c); return arr; }
function lowestDefCols(n){
  const arr=[]; for(let c=0;c<BCOLS;c++) arr.push({c,d:colDefTotal(c)});
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0,n).map(o=>o.c);
}
function highestCards(n){
  const arr=[];
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c]; if(f) arr.push({r,c,v:f.val}); }
  arr.sort((a,b)=>b.v-a.v);
  return arr.slice(0,n).map(o=>({r:o.r,c:o.c}));
}
function decideBossIntent(){
  if(bossStun>0){ bossStun=0; renderBossStun(); bossIntent={type:"stunned"}; renderBossIntent(); showBossMarks(); return; }
  const mult=phase, n=fieldCount();
  let choices;
  if(n>=4) choices=["attack","destroy"];
  else if(n<=1) choices=["summon"];
  else choices=["summon","attack","destroy"];
  const action=choices[Math.random()*choices.length|0];
  if(action==="attack"){
    bossIntent={type:"attack", val:BOSS_ATK, cols:lowestDefCols(mult)};
  } else if(action==="destroy"){
    bossIntent={type:"destroy", targets:highestCards(mult)};
  } else {
    const open=openTopCols();
    bossIntent={type:"summon", cols:open.slice(0,mult)};
  }
  renderBossIntent(); showBossMarks();
}
function refreshDestroyTarget(){
  if(!bossIntent || bossIntent.type!=="destroy") return;
  bossIntent.targets=highestCards(phase); showBossMarks();
}
function renderBossIntent(){
  const icon=bossIntentEl.querySelector(".iIcon"), val=bossIntentEl.querySelector(".iVal");
  bossIntentEl.classList.remove("attack","summon","destroy");
  if(!bossIntent){ bossIntentEl.style.display="none"; return; }
  bossIntentEl.style.display="flex"; bossIntentEl.classList.add("pulse");
  if(bossIntent.type==="attack"){ bossIntentEl.classList.add("attack"); icon.textContent="⚔️"; val.textContent=`${bossIntent.val} ×${bossIntent.cols.length}열`; }
  else if(bossIntent.type==="destroy"){ bossIntentEl.classList.add("destroy"); icon.textContent="💥"; val.textContent=`파괴 ×${bossIntent.targets.length}`; }
  else if(bossIntent.type==="stunned"){ icon.textContent="😵‍💫"; val.textContent="기절"; }
  else { bossIntentEl.classList.add("summon"); icon.textContent="🧌"; val.textContent=`소환 ×${bossIntent.cols.length}`; }
}
function hideBossIntent(){ bossIntentEl.style.display="none"; bossIntentEl.classList.remove("pulse"); }
function clearBossMarks(){ document.querySelectorAll(".colOverlay,.summonMark,.destroyMark").forEach(e=>e.remove()); }
function showBossMarks(){
  clearBossMarks();
  if(!bossIntent) return;
  if(bossIntent.type==="attack"){
    (bossIntent.cols||[]).forEach(col=>{
      const o=document.createElement("div"); o.className="colOverlay atkLine";
      o.style.left=bx(col)+"px"; o.style.top=by(0)+"px";
      o.style.width=CELL+"px"; o.style.height=(by(BROWS-1)+CELL-by(0))+"px";
      boardEl.appendChild(o);
    });
  } else if(bossIntent.type==="summon"){
    (bossIntent.cols||[]).forEach(col=>{
      const m=document.createElement("div"); m.className="summonMark"; m.textContent="🧌";
      m.style.left=fx(col)+"px"; m.style.top=fy(0)+"px"; m.style.width=CELL+"px"; m.style.height=CELL+"px"; fieldEl.appendChild(m);
    });
  } else if(bossIntent.type==="destroy"){
    (bossIntent.targets||[]).forEach(h=>{
      if(h && board[h.r] && board[h.r][h.c]){ const m=document.createElement("div"); m.className="destroyMark"; m.textContent="💥";
        m.style.left=bx(h.c)+"px"; m.style.top=by(h.r)+"px"; m.style.width=CELL+"px"; m.style.height=CELL+"px"; boardEl.appendChild(m); }
    });
  }
}
async function bossAct(){
  if(!bossIntent) return; clearBossMarks();
  if(bossIntent.type==="stunned"){ dmgPop(document.getElementById("bossArt"),"기절!","#ffec5a"); await sleep(300); return; }
  if(bossIntent.type==="summon"){
    let cols=(bossIntent.cols||[]).slice();
    for(let i=0;i<cols.length;i++){ if(field[0][cols[i]]){ const alt=openTopCols().find(x=>!cols.includes(x)); if(alt!=null) cols[i]=alt; } }
    for(const col of cols){ if(col!=null && !field[0][col]){ spawnAt(0,col); await sleep(260); } }
  } else if(bossIntent.type==="attack"){
    const art=document.getElementById("bossArt");
    for(const col of (bossIntent.cols||[])){ punch(art); applyDamageToPlayer(BOSS_ATK,col); await sleep(300); if(hp<=0) return; }
  } else if(bossIntent.type==="destroy"){
    const art=document.getElementById("bossArt"); punch(art);
    let targets=(bossIntent.targets||[]);
    if(!targets.length || targets.some(h=>!board[h.r]||!board[h.r][h.c])) targets=highestCards(phase);
    for(const h of targets){ if(h && board[h.r] && board[h.r][h.c]){ destroyCard(h.r,h.c); await sleep(220); } }
    renderColStats();
  }
}
function spawnAt(r,c,silent){
  const file=MON_FILES[Math.random()*MON_FILES.length|0];
  const e={file,hp:SUMMON_HP,maxHp:SUMMON_HP,atk:SUMMON_ATK,stun:0,el:null}; field[r][c]=e;
  if(!silent){ renderEnemies(); if(e.el){ e.el.style.transition="none"; e.el.style.transform="scale(0)"; requestAnimationFrame(()=>{ e.el.style.transition="transform .3s"; e.el.style.transform="scale(1)"; }); } }
}

/* ===== 슬라이드 (마나 2 소모, 병합 상한 16) ===== */
function slide(dir){
  if(busy)return;
  if(mana<SLIDE_COST){ flashBadge("manaBadge"); return; }
  const nb=Array.from({length:BROWS},()=>Array(BCOLS).fill(null));
  function proc(getList,setList){
    const K=(dir==='left'||dir==='right')?BROWS:BCOLS;
    for(let k=0;k<K;k++){
      const items=getList(k).filter(x=>x), out=[]; let i=0;
      while(i<items.length){
        if(i+1<items.length && items[i].val===items[i+1].val && items[i].val*2<=MERGE_CAP){
          if(items[i].el) items[i].el.remove();
          out.push({type:items[i+1].type, val:items[i].val*2, el:items[i+1].el, _merged:true});
          i+=2;
        } else { out.push(items[i]); i++; }
      }
      setList(k,out);
    }
  }
  if(dir==='left') proc(r=>board[r],(r,o)=>{for(let c=0;c<BCOLS;c++)nb[r][c]=o[c]||null;});
  else if(dir==='right') proc(r=>board[r].slice().reverse(),(r,o)=>{for(let c=0;c<BCOLS;c++)nb[r][BCOLS-1-c]=o[c]||null;});
  else if(dir==='up') proc(c=>board.map(row=>row[c]),(c,o)=>{for(let r=0;r<BROWS;r++)nb[r][c]=o[r]||null;});
  else proc(c=>board.map(row=>row[c]).reverse(),(c,o)=>{for(let r=0;r<BROWS;r++)nb[BROWS-1-r][c]=o[r]||null;});

  const before=JSON.stringify(board.map(row=>row.map(x=>x?x.val+x.type:0)));
  board=nb;
  const after=JSON.stringify(board.map(row=>row.map(x=>x?x.val+x.type:0)));
  if(before===after){ renderCards(); return; }

  mana-=SLIDE_COST;
  renderCards();
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c];
    if(f&&f._merged){ delete f._merged; if(f.el){ f.el.classList.remove("merged"); void f.el.offsetWidth; f.el.classList.add("merged"); setTimeout(()=>f.el&&f.el.classList.remove("merged"),260); } } }
  setTimeout(()=>{
    const pos=spawnBoardTile(); renderCards();
    if(pos){ const nf=board[pos[0]][pos[1]]; if(nf&&nf.el){ nf.el.classList.add("spawning"); setTimeout(()=>nf.el&&nf.el.classList.remove("spawning"),300); } }
    renderColStats(); updateHUD(); refreshDestroyTarget();
  },180);
  renderColStats(); updateHUD(); refreshDestroyTarget();
}

/* ===== 이펙트 ===== */
function punch(el){ if(!el)return; el.classList.remove("punch"); void el.offsetWidth; el.classList.add("punch"); }
function hurt(el){ if(!el)return; el.classList.remove("hurt"); void el.offsetWidth; el.classList.add("hurt"); setTimeout(()=>el.classList.remove("hurt"),400); }
function slashAt(left,top,parent){ const s=document.createElement("div"); s.className="slash"; s.style.left=left+"px"; s.style.top=top+"px"; s.style.width=CELL+"px"; s.style.height=CELL+"px"; parent.appendChild(s); setTimeout(()=>s.remove(),320); }
function defHitAnim(c){ const el=colStatsEl.children[c]; if(!el)return; el.classList.remove("defhit"); void el.offsetWidth; el.classList.add("defhit"); setTimeout(()=>el.classList.remove("defhit"),400); }
function defGainAnim(c){ const el=colStatsEl.children[c]; if(!el)return; el.classList.remove("defgain"); void el.offsetWidth; el.classList.add("defgain"); setTimeout(()=>el.classList.remove("defgain"),400); }
function bossHurt(){
  const art=document.getElementById("bossArt");
  art.classList.remove("hurt"); void art.offsetWidth; art.classList.add("hurt"); setTimeout(()=>art.classList.remove("hurt"),400);
  const s=stageScale(), rect=art.getBoundingClientRect(), st=document.getElementById("stage").getBoundingClientRect();
  const el=document.createElement("div"); el.className="slash";
  el.style.left=((rect.left-st.left)/s+rect.width/s/2-85)+"px"; el.style.top=((rect.top-st.top)/s+10)+"px";
  el.style.width="170px"; el.style.height="170px";
  gameEl.appendChild(el); setTimeout(()=>el.remove(),320);
}
function redFlash(){ const f=document.getElementById("redFlash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function centerDmg(n){ const b=document.getElementById("centerDmg"); document.getElementById("centerDmgText").textContent="-"+n; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function dmgPop(anchor,text,color){
  if(!anchor) return;
  const s=stageScale(), rect=anchor.getBoundingClientRect(), st=document.getElementById("stage").getBoundingClientRect();
  const p=document.createElement("div"); p.className="dmgPop"; p.textContent=text; p.style.color=color;
  p.style.left=((rect.left-st.left)/s+rect.width/s/2-20)+"px"; p.style.top=((rect.top-st.top)/s)+"px";
  gameEl.appendChild(p); setTimeout(()=>p.remove(),800);
}
function flashBadge(id){ const b=document.getElementById(id); b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:250}); }
function showBanner(t){ const b=document.getElementById("banner"); document.getElementById("bannerText").textContent=t; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function win(){ hideBossIntent(); clearBossMarks(); showBanner("최종 승리!"); }
function lose(){ hideBossIntent(); clearBossMarks(); showBanner("패배..."); setTimeout(()=>{ if(confirm("패배! 다시 시작?")) location.reload(); },800); }

/* ===== 입력 ===== */
let tsx,tsy,swiping=false;
boardEl.addEventListener("touchstart",e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; swiping=true; },{passive:true});
boardEl.addEventListener("touchend",e=>{ if(!swiping)return; swiping=false; const t=e.changedTouches[0]; doSwipe(t.clientX-tsx,t.clientY-tsy); },{passive:true});
let bmx,bmy,bmdown=false;
boardEl.addEventListener("mousedown",e=>{ bmx=e.clientX; bmy=e.clientY; bmdown=true; });
addEventListener("mouseup",e=>{ if(!bmdown)return; bmdown=false; doSwipe(e.clientX-bmx,e.clientY-bmy); });
function doSwipe(dx,dy){ if(Math.abs(dx)<30&&Math.abs(dy)<30)return; if(Math.abs(dx)>Math.abs(dy)) slide(dx>0?'right':'left'); else slide(dy>0?'down':'up'); }
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")slide('left'); else if(e.key==="ArrowRight")slide('right');
  else if(e.key==="ArrowUp")slide('up'); else if(e.key==="ArrowDown")slide('down');
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); endTurn(); }
});

(async function boot(){
  try{
    await loadData();
    document.getElementById("loadMsg").classList.add("hidden");
    initArchSelect();
  }catch(err){
    showLoadError(err);
  }
})();
