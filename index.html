<head>

<title>PORCYON</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100dvh;overflow:hidden;background:#05060f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf2ff;overscroll-behavior:none;}
  #app{position:fixed;inset:0;touch-action:none;}

  .glass{
    background:rgba(120,150,230,.12);
    border:1px solid rgba(180,205,255,.28);
    border-radius:16px;
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22);
    position:relative;
  }
  .btn{
    background:rgba(140,170,255,.14);
    border:1px solid rgba(190,210,255,.35);
    color:#eaf2ff;font-weight:700;letter-spacing:1px;
    padding:12px 16px;border-radius:14px;cursor:pointer;font-size:14px;
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 4px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .06s,background .15s,box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .btn:hover{background:rgba(150,180,255,.22);}
  .btn:active{transform:translateY(2px) scale(.98);background:rgba(120,150,255,.28);}
  .btn.acc{
    background:linear-gradient(140deg,rgba(90,220,255,.32),rgba(120,120,255,.28));
    border-color:rgba(150,240,255,.55);color:#f2fbff;
    box-shadow:0 4px 22px rgba(60,180,255,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn.lg{font-size:18px;padding:16px 30px;min-width:230px;}

  #ui{position:fixed;top:8px;left:8px;right:8px;z-index:10;display:flex;gap:6px;align-items:center;}
  #back{padding:9px 12px;font-size:16px;}
  #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:10;}

  #pad{position:fixed;bottom:16px;right:16px;z-index:10;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(4,54px);gap:5px;}
  #pad .btn{font-size:22px;padding:0;}
  #pad .sp{grid-column:1/4;font-size:13px;}

  .pxwrap{display:inline-flex;align-items:center;justify-content:center;}

  .screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 25%,rgba(30,26,70,.55) 0%,rgba(10,10,32,.72) 60%,rgba(4,5,14,.9) 100%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:opacity .4s;}
  .hidden{display:none!important;}
  .fadeout{opacity:0;pointer-events:none;}

  #lobbyTitle{margin-bottom:40px;max-width:96vw;}
  #lobbyTitle canvas{max-width:96vw;height:auto;}
  #lobbyBtns{display:flex;flex-direction:column;gap:16px;align-items:center;}

  #stageScreen{justify-content:flex-start;padding-top:70px;}
  #stageScreen .hd{margin-bottom:16px;}
  #stageGridWrap{
    width:min(92vw,430px);flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:6px 6px 90px;margin-top:6px;
  }
  #stageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .cell{
    aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:14px;cursor:pointer;position:relative;
  }
  .cell.locked{opacity:.32;filter:grayscale(.6) brightness(.6);cursor:not-allowed;}
  .cell.locked::before{content:"🔒";position:absolute;font-size:26px;filter:grayscale(1);}
  .cell.locked .pxwrap{opacity:0;}
  .cell.cleared{border-color:rgba(130,230,255,.6);box-shadow:0 0 16px rgba(80,200,255,.4), inset 0 1px 0 rgba(255,255,255,.3);}
  .cell.cleared::after{content:"★";position:absolute;top:5px;right:8px;color:#9fe8ff;font-size:13px;text-shadow:0 0 6px #40b0ff;}
  #stageBack{position:fixed;top:16px;left:16px;z-index:41;}

  #clearPop{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
    background:rgba(6,8,20,.55);opacity:0;transition:opacity .4s;pointer-events:none;}
  #clearPop.show{opacity:1;pointer-events:auto;}
  #clearCard{width:min(84vw,340px);padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:20px;
    transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.4,.4,1);}
  #clearPop.show #clearCard{transform:scale(1);}
  #clearCard .row{display:flex;gap:12px;}

  #solveOv{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;
    background:rgba(6,8,20,.45);opacity:0;transition:opacity .25s;pointer-events:none;}
  #solveOv.show{opacity:1;pointer-events:auto;}

  #err{position:fixed;top:60px;left:8px;right:8px;background:#600;color:#fff;padding:10px;border-radius:8px;font-size:12px;z-index:99;display:none;white-space:pre-wrap;word-break:break-all;}

<script type="module">
const errBox=document.getElementById('err');
function showErr(e){ errBox.style.display='block'; errBox.textContent='오류: '+(e&&e.stack?e.stack:e); }
window.addEventListener('error',ev=>showErr(ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>showErr(ev.reason));

let THREE, RoundedBoxGeometry;
try {
  THREE=await import('three');
  ({RoundedBoxGeometry}=await import('three/addons/geometries/RoundedBoxGeometry.js'));
} catch(e){ showErr('three.js 로드 실패: '+e); throw e; }

/* ==========================================================================
   SFX — Web Audio API 절차적 효과음
   ========================================================================== */
let audioContext=null;
function getAudioContext(){
  if(!audioContext){ audioContext=new (window.AudioContext||window.webkitAudioContext)(); }
  return audioContext;
}
// 첫 사용자 입력 시 오디오 언락
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked)return;
  const ctx=getAudioContext();
  if(ctx.state==='suspended') ctx.resume();
  audioUnlocked=true;
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>{
  window.addEventListener(ev, unlockAudio, {passive:true});
});

// 기본 톤 (volume 배율 인자 추가 — 자동재생 시 볼륨 축소용)
function playTone(freq, duration, type='sine', volume=0.3, decay=0.8, vmul=1){
  const ctx=getAudioContext();
  if(ctx.state==='suspended') return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const filter=ctx.createBiquadFilter();
  osc.type=type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  filter.type='lowpass';
  filter.frequency.value=2800;
  gain.gain.setValueAtTime(volume*vmul, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration*decay);
  osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

// 유리 띵 (type 1~3), vmul: 볼륨 배율
function playTing(type, vmul=1){
  if(type===1){
    playTone(1380,0.75,'triangle',0.45,0.55,vmul);
    playTone(1950,0.55,'sine',0.28,0.7,vmul);
    setTimeout(()=>playTone(2600,0.35,'sine',0.18,0.8,vmul),40);
  } else if(type===2){
    playTone(980,0.9,'triangle',0.4,0.65,vmul);
    playTone(1480,0.7,'sine',0.32,0.75,vmul);
    setTimeout(()=>playTone(2100,0.45,'sine',0.2,0.8,vmul),60);
  } else {
    playTone(1650,0.6,'sawtooth',0.35,0.5,vmul);
    playTone(2350,0.5,'sine',0.3,0.6,vmul);
    setTimeout(()=>playTone(3200,0.4,'sine',0.22,0.8,vmul),25);
  }
}
function playTingRandom(vmul=1){ playTing(1+Math.floor(Math.random()*3), vmul); }

// 블랙홀 (추락)
function playBlackhole(){
  const ctx=getAudioContext(); if(ctx.state==='suspended')return;
  const noise=ctx.createBufferSource();
  const buffer=ctx.createBuffer(1, ctx.sampleRate*2.2, ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<buffer.length;i++){ data[i]=(Math.random()*2-1)*(1-i/buffer.length); }
  noise.buffer=buffer;
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();
  const resonance=ctx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.setValueAtTime(1200, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(40, ctx.currentTime+2.1);
  resonance.type='lowpass'; resonance.frequency.value=180; resonance.Q.value=8;
  gain.gain.setValueAtTime(0.8, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2.3);
  const drone=ctx.createOscillator();
  drone.type='sine';
  drone.frequency.setValueAtTime(65, ctx.currentTime);
  drone.frequency.exponentialRampToValueAtTime(28, ctx.currentTime+2.2);
  const droneGain=ctx.createGain();
  droneGain.gain.setValueAtTime(0.25, ctx.currentTime);
  droneGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2.1);
  noise.connect(filter); filter.connect(resonance); resonance.connect(gain); gain.connect(ctx.destination);
  drone.connect(droneGain); droneGain.connect(ctx.destination);
  noise.start(); drone.start(); drone.stop(ctx.currentTime+2.3);
}

// 스위치 / 레버
function playSwitch(){
  playTone(420,0.08,'square',0.6,0.3);
  playTone(180,0.25,'sawtooth',0.4,0.6);
  setTimeout(()=>playTone(680,0.4,'triangle',0.25,0.8),60);
  setTimeout(()=>playTone(320,0.35,'sine',0.2,0.9),120);
}

// 텔레포트 (분할/전환/합치기 공용)
function playTeleport(){
  const ctx=getAudioContext(); if(ctx.state==='suspended')return;
  const noise=ctx.createBufferSource();
  const buffer=ctx.createBuffer(1, ctx.sampleRate*0.9, ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<buffer.length;i++){ data[i]=Math.random()*2-1; }
  noise.buffer=buffer;
  const filter=ctx.createBiquadFilter();
  filter.type='bandpass';
  filter.frequency.setValueAtTime(800, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(3800, ctx.currentTime+0.7);
  filter.Q.value=2;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.7, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.85);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
  playTone(1200,0.6,'sine',0.3,0.4);
  setTimeout(()=>playTone(2400,0.5,'sine',0.25,0.5),80);
  setTimeout(()=>playTone(3600,0.7,'triangle',0.2,0.6),180);
}

// 스테이지 클리어
function playStageClear(){
  const notes=[880,1100,1380,1760,2200];
  let delay=0;
  notes.forEach((freq)=>{
    setTimeout(()=>{
      playTone(freq,0.65,'triangle',0.38,0.6);
      playTone(freq*1.48,0.5,'sine',0.22,0.7);
    }, delay);
    delay+=85;
  });
  setTimeout(()=>playTone(2800,1.1,'sine',0.2,0.45),520);
}

// 허리케인 (인트로 타일)
function playHurricane(){
  const ctx=getAudioContext(); if(ctx.state==='suspended')return;
  const totalDuration=3.2;
  const noise=ctx.createBufferSource();
  const buffer=ctx.createBuffer(1, ctx.sampleRate*totalDuration, ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<buffer.length;i++){
    const progress=i/buffer.length;
    const envelope=Math.min(1.0, progress*1.8)*Math.max(0, 1-(progress-0.65)*2.5);
    data[i]=(Math.random()*2-1)*envelope*0.85;
  }
  noise.buffer=buffer;
  const lowFilter=ctx.createBiquadFilter();
  const midFilter=ctx.createBiquadFilter();
  const gain=ctx.createGain();
  lowFilter.type='lowpass';
  lowFilter.frequency.setValueAtTime(220, ctx.currentTime);
  lowFilter.frequency.exponentialRampToValueAtTime(1350, ctx.currentTime+1.6);
  lowFilter.frequency.exponentialRampToValueAtTime(520, ctx.currentTime+totalDuration);
  midFilter.type='bandpass';
  midFilter.frequency.setValueAtTime(580, ctx.currentTime);
  midFilter.frequency.exponentialRampToValueAtTime(920, ctx.currentTime+1.4);
  midFilter.Q.value=1.4;
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(1.1, ctx.currentTime+1.55);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+totalDuration);
  noise.connect(lowFilter); lowFilter.connect(midFilter); midFilter.connect(gain); gain.connect(ctx.destination);
  noise.start();
  const drone=ctx.createOscillator();
  drone.type='sine';
  drone.frequency.setValueAtTime(42, ctx.currentTime);
  drone.frequency.exponentialRampToValueAtTime(78, ctx.currentTime+1.8);
  drone.frequency.exponentialRampToValueAtTime(55, ctx.currentTime+totalDuration);
  const droneGain=ctx.createGain();
  droneGain.gain.setValueAtTime(0.25, ctx.currentTime);
  droneGain.gain.exponentialRampToValueAtTime(0.55, ctx.currentTime+1.4);
  droneGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+totalDuration+0.3);
  drone.connect(droneGain); droneGain.connect(ctx.destination);
  drone.start(); drone.stop(ctx.currentTime+totalDuration+0.4);
}

function drawSparkle(g,cx,cy,r){
  const i=r*0.28;

  g.quadraticCurveTo(cx+i,cy-i,cx+r,cy);
  g.quadraticCurveTo(cx+i,cy+i,cx,cy+r);
  g.quadraticCurveTo(cx-i,cy+i,cx-r,cy);
  g.quadraticCurveTo(cx-i,cy-i,cx,cy-r);

function pixelText(el, text, opt={}){
  const color = opt.color || "#ffffff";
  const glow  = opt.glow !== false;
  const scale = (opt.px||6) * 2.6;
  const UNIT_W=100, UNIT_H=140, SPACE=34, KERN=6;
  text = text.toUpperCase();
  const chars=[...text];
  const advances = chars.map(c=> c===' '? SPACE : UNIT_W);
  const totalUnits = advances.reduce((a,b)=>a+b,0) + (chars.length-1)*KERN;
  const s = scale/UNIT_H;
  const W = totalUnits*s, H = UNIT_H*s;
  const dpr=Math.min(devicePixelRatio||1,2);
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,W*dpr); cv.height=Math.max(1,H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const SS = (16/6.5) * s;
  const LINE_W = Math.max(1.2, 2.4*s);
  const LINE_OP = 0.55;
  let ox=0;
  for(let ci=0; ci<chars.length; ci++){
    const ch=chars[ci];
    if(ch===' '){ ox += (SPACE+KERN)*s; continue; }
    const gd=G[ch]; const adv=(gd?UNIT_W:SPACE);
    if(gd){
      g.strokeStyle=color; g.lineWidth=LINE_W; g.lineCap='round';
      g.globalAlpha=LINE_OP;
      if(glow){ g.shadowColor=color; g.shadowBlur=4*s; } else g.shadowBlur=0;
      gd.e.forEach(([i,j])=>{
        const a=gd.n[i], b=gd.n[j];
        g.beginPath(); g.moveTo(ox+a[0]*s, a[1]*s); g.lineTo(ox+b[0]*s, b[1]*s); g.stroke();
      });
      g.globalAlpha=1; g.fillStyle=color;
      const big=new Set(gd.big||[]);
      gd.n.forEach((p,idx)=>{
        const r=((big.has(idx)?SS*1.6:SS)*(idx%3===0?1:0.85));
        g.globalAlpha=0.12; if(glow){g.shadowBlur=8*s;} drawCircle(g,ox+p[0]*s,p[1]*s,r*1.9);
        g.globalAlpha=1; if(glow){g.shadowColor=color;g.shadowBlur=6*s;} else g.shadowBlur=0;
        drawSparkle(g,ox+p[0]*s,p[1]*s,r);
      });
      g.shadowBlur=0; g.globalAlpha=1;
    }
    ox += (adv+KERN)*s;
  }
  el.innerHTML=''; el.appendChild(cv);
  return cv;
}

function parseStage(d){
  const rows=d.grid.length, cols=Math.max(...d.grid.map(r=>r.length));
  const cell=[]; let start=[0,0];
  for(let r=0;r<rows;r++){ cell[r]=[]; for(let c=0;c<cols;c++){
    const ch=d.grid[r][c]||' '; let t={type:'none'};
    if(ch==='.')t={type:'floor'};
    else if(ch==='-')t={type:'frag'};
    else if(ch==='O')t={type:'floor'};
    else if(ch==='H')t={type:'hole'};
    else if(ch==='S'){t={type:'floor'};start=[r,c];}
    else if(ch==='X')t={type:'floor',hard:true};
    else if(ch==='T')t={type:'floor',tele:true};
    else if(ch==='B')t={type:'bridge'};
    else if(ch==='b')t={type:'bridge'};
    cell[r][c]=t;
  }}
  const switches=d.switches.map(s=>{ const ch=(d.grid[s[0]]&&d.grid[s[0]][s[1]])||' '; return {r:s[0],c:s[1],acts:s[2],hard:ch==='X'}; });
  const bridges=d.bridges.map(cells=>{ const ch=(d.grid[cells[0][0]]&&d.grid[cells[0][0]][cells[0][1]])||' '; return {cells:cells.map(p=>[p[0],p[1]]),on0:ch==='B'}; });

  let mask0=0; bridges.forEach((b,i)=>{ if(b.on0) mask0|=(1<<i); });

  } else { const[[r1,c1],[r2,c2]]=b.cells; const hor=r1===r2; const[dr,dc]=S_delta(mv);
    if((mv==='L'||mv==='R')&&hor){ nc=mv==='L'?[[r1,Math.min(c1,c2)-1]]:[[r1,Math.max(c1,c2)+1]]; nm='stand'; }
    else if((mv==='U'||mv==='D')&&!hor){ nc=mv==='U'?[[Math.min(r1,r2)-1,c1]]:[[Math.max(r1,r2)+1,c1]]; nm='stand'; }
    else { nc=[[r1+dr,c1+dc],[r2+dr,c2+dc]]; nm='lie'; }
  }
  st.block={mode:nm,cells:nc};
  if(nm==='stand'){ const[r,c]=nc[0];
    if(r>=0&&r<P.rows&&c>=0&&c<P.cols&&P.cell[r][c].type==='hole') return {status:'win'};
    if(!S_supported(P,st.mask,r,c)) return {status:'dead'};
    if(P.cell[r][c].type==='frag') return {status:'dead'};
  } else {
    for(const[r,c]of nc) if(!S_supportedLie(P,st.mask,r,c)) return {status:'dead'};
  }
  st.mask=S_applySwitches(P,st.mask,nc, nm==='stand'?nc[0]:null);
  if(nm==='stand'){ const[r,c]=nc[0];
    if(P.cell[r][c].tele){ const tp=P.teleports.find(x=>x.r===r&&x.c===c);
      if(tp){ const R=tp.raw; st.split={a:{r:R[2],c:R[3]},b:{r:R[4],c:R[5]},active:R[6]===1?'b':'a'}; st.block=null; }
    }

}
function solveStage(idx){
  const P=parseStage(STAGES[idx]);
  const init={block:{mode:'stand',cells:[[P.start[0],P.start[1]]]},split:null,mask:P.mask0};
  const MOVES=['U','D','L','R','S'];
  const q=[init]; const prev=new Map(); const visited=new Set();
  visited.add(S_key(init)); prev.set(S_key(init),null);
  let head=0;
  while(head<q.length){
    const cur=q[head++]; const curKey=S_key(cur);
    for(const mv of MOVES){
      const res=S_step(P,cur,mv);
      if(res.status==='dead') continue;
      if(res.status==='win'){
        let path=[mv]; let k=curKey;
        while(prev.get(k)){ const {pk,m}=prev.get(k); path.push(m); k=pk; }
        path.reverse(); return path.join('');
      }
      const nk=S_key(res.st);
      if(visited.has(nk)) continue;
      visited.add(nk); prev.set(nk,{pk:curKey,m:mv}); q.push(res.st);
    }
  }
  return null;
}
const solutionCache={};
function ensureSolution(idx, cb){
  if(solutionCache[idx]!==undefined && solutionCache[idx]!=='solving'){ cb&&cb(solutionCache[idx]); return; }
  if(solutionCache[idx]==='solving'){ cb&&(pendingSolveCb[idx]=(pendingSolveCb[idx]||[]).concat(cb)); return; }
  solutionCache[idx]='solving';
  pendingSolveCb[idx]=pendingSolveCb[idx]||[];
  if(cb)pendingSolveCb[idx].push(cb);
  setTimeout(()=>{
    let sol=null;
    try{ sol=solveStage(idx); }catch(e){ showErr('solve '+idx+': '+e); sol=null; }
    solutionCache[idx]=sol;
    (pendingSolveCb[idx]||[]).forEach(f=>f(sol)); pendingSolveCb[idx]=[];
  },10);
}

function loadStage(i){

  for(let r=0;r<rows;r++){ tiles[r]=[]; for(let c=0;c<cols;c++){
    const ch=d.grid[r][c]||' '; let t={type:'none'};
    if(ch==='.')t={type:'floor'};
    else if(ch==='-')t={type:'frag'};
    else if(ch==='O')t={type:'floor'};
    else if(ch==='H')t={type:'hole'};
    else if(ch==='S'){t={type:'floor'};start=[r,c];}
    else if(ch==='X')t={type:'floor',hard:true};
    else if(ch==='T')t={type:'floor',tele:true};

function fitCamera(){
  if(!game)return;
  const w=innerWidth,h=innerHeight,aspect=w/h;
  const target=new THREE.Vector3((game.cols-1)/2,0,(game.rows-1)/2);
  camera.position.copy(target).addScaledVector(camDir,camDist);
  camera.up.set(0,1,0); camera.lookAt(target); camera.updateMatrixWorld();
  const minR=-0.5, maxR=game.rows-0.5, minC=-0.5, maxC=game.cols-0.5;
  const yLo=-1.0, yHi=TALL+0.5;
  const inv=new THREE.Matrix4().copy(camera.matrixWorldInverse);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const cc of [minC,maxC]) for(const rr of [minR,maxR]) for(const yy of [yLo,yHi]){
    const v=new THREE.Vector3(wx(cc),yy,wz(rr)).applyMatrix4(inv);
    if(v.x<minX)minX=v.x; if(v.x>maxX)maxX=v.x; if(v.y<minY)minY=v.y; if(v.y>maxY)maxY=v.y;
  }
  const pad=0.3;
  let hw=(maxX-minX)/2+pad, hh=(maxY-minY)/2+pad;
  if(hw/hh < aspect){ hw=hh*aspect; } else { hh=hw/aspect; }
  camera.left=-hw; camera.right=hw; camera.top=hh; camera.bottom=-hh;
  camera.updateProjectionMatrix(); renderer.setSize(w,h);
}

let tileMeshes=[];
function buildBoard(){
  if(board)scene.remove(board);
  board=new THREE.Group(); scene.add(board);
  tileMeshes=[];
  for(let r=0;r<game.rows;r++)for(let c=0;c<game.cols;c++){
    const t=game.tiles[r][c], br=brAt(r,c);
    if(br){ if(!br.on)continue;
      const m=new THREE.Mesh(tileGeo,MAT.bridge.clone()); m.position.set(wx(c),-TILE_H/2,wz(r)); m.receiveShadow=true; board.add(m); tileMeshes.push(m); continue; }
    if(t.type==='none')continue;
    if(t.type==='hole'){ const g=makeGoal(); g.position.set(wx(c),0,wz(r)); board.add(g); tileMeshes.push(g); continue; }
    let mat;
    if(t.type==='frag')mat=MAT.frag.clone(); else if(t.hard)mat=MAT.hard.clone(); else if(t.tele)mat=MAT.tele.clone(); else mat=((r+c)%2?MAT.a:MAT.b).clone();
    const sw=swAt(r,c); if(sw&&!sw.hard&&!t.tele)mat=MAT.soft.clone();
    const m=new THREE.Mesh(tileGeo,mat); m.position.set(wx(c),-TILE_H/2,wz(r)); m.receiveShadow=true; board.add(m); tileMeshes.push(m);
    let marker=null;
    if(t.tele){ marker=makeTeleMarker(); }
    else if(sw){ marker = sw.hard ? makeHardMarker() : makeSoftMarker(); }
    if(marker){ marker.position.set(wx(c),0,wz(r)); board.add(marker); tileMeshes.push(marker); }
  }
}

    splitGroup=new THREE.Group(); scene.add(splitGroup);
    for(let i=0;i<2;i++){
      const pv=new THREE.Group(); splitGroup.add(pv);
      const m=new THREE.Mesh(cubeGeo, i===0?MAT.block:MAT.alt); m.castShadow=true;
      m.add(new THREE.LineSegments(cubeEdgeGeo,new THREE.LineBasicMaterial({color:0xaef0ff,transparent:true,opacity:.7})));
      pv.add(m); cubePivots.push(pv); cubeMeshes.push(m);
      const fx=makeFx(UNIT*0.5,true); m.add(fx); cubeFx.push(fx);
    }
  }
}

function drawBlock(yOff=0){
  ensureBlockMesh();
  if(game.split){
    blockPivot.visible=false; splitGroup.visible=true;
    for(const k of ['a','b']){ const idx=k==='a'?0:1; const p=game.split[k];
      const pv=cubePivots[idx], m=cubeMeshes[idx];
      pv.position.set(0,0,0); pv.rotation.set(0,0,0);
      m.position.set(wx(p.c),TOP_Y+UNIT/2,wz(p.r));
      const isActive=(game.split.active===k);
      m.material = isActive?MAT.block:MAT.alt; m.userData.splitKey=k;
      cubeFx[idx].visible = isActive;
    }
    return;
  }
  blockPivot.visible=true; splitGroup.visible=false;
  blockPivot.position.set(0,yOff,0); blockPivot.rotation.set(0,0,0);
  const b=game.block;
  if(b.mode==='stand'){ const [r,c]=b.cells[0]; blockMesh.position.set(wx(c),TOP_Y+TALL/2,wz(r)); }
  else { const [[ra,ca],[rb,cb]]=b.cells; const cx=(wx(ca)+wx(cb))/2, cz=(wz(ra)+wz(rb))/2; blockMesh.position.set(cx,TOP_Y+UNIT/2,cz); }
  blockMesh.material=MAT.block;
}

function startIntro(){
  game.intro=true;
  intro={ phase:'tiles', t:0 };
  playHurricane(); /* SFX: 인트로 타일 등장 */
  tileMeshes.forEach((m,i)=>{
    m.userData.baseY=m.position.y; m.userData.delay=i*14;
    m.position.y=m.userData.baseY-6; m.visible=true;
    m.traverse(o=>{ if(o.material){ o.material.transparent=true;
      if(o.userData.baseOp==null) o.userData.baseOp=(o.material.opacity!=null?o.material.opacity:1);
      o.material.opacity=0; } });
  });
  blockPivot.visible=false; splitGroup.visible=false;
  drawBlock(14); blockPivot.visible=false;
}
function setTileOpacity(m,f){ m.traverse(o=>{ if(o.material){ o.material.opacity=(o.userData.baseOp!=null?o.userData.baseOp:1)*f; } }); }

function delta(d){ return d==='U'?[-1,0]:d==='D'?[1,0]:d==='L'?[0,-1]:[0,1]; }
function tryMove(d){ if(anim||game.won||game.dead||game.intro)return; if(game.split)moveSplit(d); else moveBlock(d); }

// 자동재생 중인지 (roll 사운드 볼륨 축소용)
function rollVmul(){ return autoplay ? 0.35 : 1; }

function moveBlock(dir){
  const b=game.block; let nc,nm;
  if(b.mode==='stand'){ const[r,c]=b.cells[0];
    if(dir==='U')nc=[[r-2,c],[r-1,c]]; else if(dir==='D')nc=[[r+1,c],[r+2,c]];
    else if(dir==='L')nc=[[r,c-2],[r,c-1]]; else nc=[[r,c+1],[r,c+2]]; nm='lie';
  } else { const[[r1,c1],[r2,c2]]=b.cells; const hor=r1===r2; const[dr,dc]=delta(dir);
    if((dir==='L'||dir==='R')&&hor){ nc=dir==='L'?[[r1,Math.min(c1,c2)-1]]:[[r1,Math.max(c1,c2)+1]]; nm='stand'; }
    else if((dir==='U'||dir==='D')&&!hor){ nc=dir==='U'?[[Math.min(r1,r2)-1,c1]]:[[Math.max(r1,r2)+1,c1]]; nm='stand'; }
    else { nc=[[r1+dr,c1+dc],[r2+dr,c2+dc]]; nm='lie'; }
  }
  playTingRandom(rollVmul()); /* SFX: 블록 굴리기 */
  roll(b,dir,()=>{ game.block={mode:nm,cells:nc}; land(); });
}
function supported(r,c){ if(r<0||r>=game.rows||c<0||c>=game.cols)return false;
  const br=brAt(r,c); if(br)return br.on; const t=game.tiles[r][c];
  if(t.type==='none'||t.type==='hole')return false; return true; }
function supportedForLie(r,c){ if(r<0||r>=game.rows||c<0||c>=game.cols)return false;
  const br=brAt(r,c); if(br)return br.on; const t=game.tiles[r][c];
  if(t.type==='none')return false; return true; }
function land(){
  const b=game.block;
  if(b.mode==='stand'){ const[r,c]=b.cells[0];
    if(r>=0&&r<game.rows&&c>=0&&c<game.cols&&game.tiles[r][c].type==='hole'){ drawBlock(); win(); return; }
    if(!supported(r,c)){ drawBlock(); die(); return; }
    if(game.tiles[r][c].type==='frag'){ drawBlock(); die(); return; }
  } else { for(const[r,c]of b.cells) if(!supportedForLie(r,c)){ drawBlock(); die(); return; } }
  doSwitches(); doTeleport(); buildBoard(); drawBlock(); status();
}
function doSwitches(){ const b=game.block;
  for(const sw of game.switches){ let p=false;
    if(sw.hard)p=b.mode==='stand'&&b.cells[0][0]===sw.r&&b.cells[0][1]===sw.c;
    else p=b.cells.some(x=>x[0]===sw.r&&x[1]===sw.c);
    if(p){ playSwitch(); /* SFX: 스위치 밟음 */
      for(const[bi,a]of sw.acts){ const br=game.bridges[bi]; if(!br)continue; br.on=a==='on'?true:a==='off'?false:!br.on; }
    }
  }
}
function doTeleport(){ const b=game.block; if(b.mode!=='stand')return;
  const[r,c]=b.cells[0]; if(!game.tiles[r][c].tele)return;
  const tp=game.teleports.find(x=>x.r===r&&x.c===c); if(!tp)return; const R=tp.raw;
  playTeleport(); /* SFX: 텔레포트(분할) */
  game.split={a:{r:R[2],c:R[3]},b:{r:R[4],c:R[5]},active:R[6]===1?'b':'a'};
  game.block=null; cubeMeshes.forEach(m=>m.quaternion.identity());
}
function moveSplit(dir){ const[dr,dc]=delta(dir); const s=game.split; const cu=s[s.active];
  const nr=cu.r+dr,ncc=cu.c+dc;
  playTingRandom(rollVmul()); /* SFX: 큐브 굴리기 (블록 굴리기와 동일) */
  cubeRoll(s.active,cu.r,cu.c,dir,()=>{ s[s.active].r=nr; s[s.active].c=ncc; splitLand(); }); }
function splitLand(){ const s=game.split;
  for(const k of['a','b'])if(!supported(s[k].r,s[k].c)){ die();return; }
  const A=s.a,B=s.b, adj=(A.r===B.r&&Math.abs(A.c-B.c)===1)||(A.c===B.c&&Math.abs(A.r-B.r)===1);
  if(adj){ game.block={mode:'lie',cells:[[A.r,A.c],[B.r,B.c]]}; game.split=null;
    playTeleport(); /* SFX: 텔레포트(합치기) */
    blockMesh.quaternion.identity();
    if(A.r===B.r) blockMesh.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
    else blockMesh.quaternion.setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI/2);
    doSwitches(); doTeleport(); }
  else for(const sw of game.switches){ if(sw.hard)continue; for(const k of['a','b'])
    if(s[k].r===sw.r&&s[k].c===sw.c){ playSwitch(); /* SFX: 분할 상태 스위치 */
      for(const[bi,a]of sw.acts){ const br=game.bridges[bi]; if(br)br.on=a==='on'?true:a==='off'?false:!br.on; } } }
  buildBoard(); drawBlock(); status();
}
function toggleSplit(){ if(game.split){ game.split.active=game.split.active==='a'?'b':'a';
  playTeleport(); /* SFX: 텔레포트(전환) */
  drawBlock(); } }

function roll(old,dir,done){
  const [dr,dc]=delta(dir);
  const standing = old.mode==='stand';
  let ra,ca,rb,cb;
  if(standing){ [ra,ca]=old.cells[0]; rb=ra; cb=ca; } else { [[ra,ca],[rb,cb]]=old.cells; }
  const cx=(wx(ca)+wx(cb))/2, cz=(wz(ra)+wz(rb))/2;
  let edge=0.5;
  if(!standing){ const horiz=(ra===rb), along=horiz?(dc!==0):(dr!==0); edge=along?1.0:0.5; }
  const px=cx+dc*edge, pz=cz+dr*edge;
  blockPivot.position.set(px,TOP_Y,pz); blockPivot.rotation.set(0,0,0);
  const my = standing ? (TOP_Y+TALL/2) : (TOP_Y+UNIT/2);
  blockMesh.position.set(cx-px, my-TOP_Y, cz-pz);
  const axis=new THREE.Vector3(); if(dc!==0) axis.set(0,0,-dc); else axis.set(dr,0,0);
  anim={pivot:blockPivot, mesh:blockMesh, axis:axis.normalize(), t:0, dur:Math.max(60,stepDelay*.6), done};
}
function cubeRoll(k,r,c,dir,done){
  const idx=k==='a'?0:1; const pv=cubePivots[idx], m=cubeMeshes[idx];
  const [dr,dc]=delta(dir); const cx=wx(c), cz=wz(r);
  const px=cx+dc*0.5, pz=cz+dr*0.5;
  pv.position.set(px,TOP_Y,pz); pv.rotation.set(0,0,0);
  m.position.set(cx-px, (TOP_Y+UNIT/2)-TOP_Y, cz-pz);
  const axis=new THREE.Vector3(); if(dc!==0) axis.set(0,0,-dc); else axis.set(dr,0,0);
  anim={pivot:pv, mesh:m, axis:axis.normalize(), t:0, dur:Math.max(60,stepDelay*.6), done};
}

function win(){ game.won=true; autoplay=null; const [r,c]=game.block.cells[0]; intro={ phase:'sink', t:0, r, c };
  playStageClear(); /* SFX: 클리어 */ }
function die(){ game.dead=true; autoplay=null; intro={ phase:'fall', t:0 };
  playBlackhole(); /* SFX: 추락 */ }
function finishWin(){ SAVE.cleared[cur]=true; if(cur+1<STAGES.length) SAVE.unlocked=Math.max(SAVE.unlocked,cur+2); persist(); showClearPopup(); }

let lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=now-lastT; lastT=now;
  if(starField){ starField.rotation.y+=dt*0.00003; starField.material.opacity=.7+.2*Math.sin(now*0.001); }
  if(energyUniforms) energyUniforms.uTime.value = now*0.0005;
  if(sparkleMat) sparkleMat.uniforms.uTime.value = now*0.0005;

  if(intro && game){
    intro.t+=dt;
    if(intro.phase==='tiles'){
      let allDone=true;
      tileMeshes.forEach(m=>{ const local=intro.t-m.userData.delay;
        if(local<0){ allDone=false; setTileOpacity(m,0); return; }
        const k=Math.min(1,local/300); const e=1-Math.pow(1-k,3);
        m.position.y=m.userData.baseY-6*(1-e); setTileOpacity(m, e); if(k<1)allDone=false; });
      if(allDone){ tileMeshes.forEach(m=>{ m.position.y=m.userData.baseY; setTileOpacity(m,1); });
        intro.phase='drop'; intro.t=0; blockPivot.visible=!game.split; splitGroup.visible=false; }
    } else if(intro.phase==='drop'){
      const dur=420; const k=Math.min(1,intro.t/dur); const e=k*k; drawBlock(14*(1-e));
      if(k>=1){ intro.phase='bounce'; intro.t=0; }
    } else if(intro.phase==='bounce'){
      const dur=520; const k=Math.min(1,intro.t/dur); const amp=0.35*Math.exp(-4*k)*Math.abs(Math.sin(16*k)); drawBlock(amp);
      if(k>=1){ intro=null; game.intro=false; drawBlock(); status(); }
    } else if(intro.phase==='sink'){
      const dur=650; const k=Math.min(1,intro.t/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      drawBlock(-(TALL+0.6)*e); const s=1-0.15*e; blockMesh.scale.set(s,s,s);
      if(k>=1){ intro=null; blockMesh.scale.set(1,1,1); blockPivot.visible=false; finishWin(); }
    } else if(intro.phase==='fall'){
      const dur=600; const k=Math.min(1,intro.t/dur); drawBlock(-9*k*k);
      if(k>=1){ intro=null; blockPivot.visible=false; showFailPopup(); }
    }
  }

  if(anim){ anim.t+=dt; const k=Math.min(1,anim.t/anim.dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    anim.pivot.rotation.set(0,0,0); anim.pivot.rotateOnAxis(anim.axis,(Math.PI/2)*e);
    if(k>=1){ const q=new THREE.Quaternion().setFromAxisAngle(anim.axis, Math.PI/2); anim.mesh.quaternion.premultiply(q);
      anim.pivot.rotation.set(0,0,0); const d=anim.done; anim=null; d(); }
  }
  if(autoplay&&!anim&&!game.won&&!game.dead&&!game.intro){
    if(now-autoplay.last>=stepDelay){ autoplay.last=now; stepAuto(); } }

  if(renderer&&scene&&camera) renderer.render(scene,camera);
}

function startAuto(){
  if(game.won||game.dead) loadStage(cur);
  const idx=cur;
  const begin=(sol)=>{
    if(cur!==idx) return;
    hideSolveOverlay();
    if(!sol){ showSolveOverlay("NO SOLUTION"); setTimeout(hideSolveOverlay,1400); return; }
    autoplay={m:sol,i:0,last:performance.now()-stepDelay};
  };
  const cached=solutionCache[idx];
  if(cached!==undefined && cached!=='solving'){ begin(cached); }
  else { showSolveOverlay("SOLVING"); ensureSolution(idx, begin); }
}
function stepAuto(){ if(!autoplay)return;
  if(autoplay.i>=autoplay.m.length){ autoplay=null; return; }
  const mv=autoplay.m[autoplay.i++];
  if(mv==='S')toggleSplit(); else tryMove(mv); }

const raycaster=new THREE.Raycaster();
function pickCube(clientX,clientY){
  if(!game||!game.split||anim||game.intro)return false;
  const rect=renderer.domElement.getBoundingClientRect();
  const nx=((clientX-rect.left)/rect.width)*2-1;
  const ny=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera({x:nx,y:ny}, camera);
  const hits=raycaster.intersectObjects(cubeMeshes, false);
  if(hits.length){ const key=hits[0].object.userData.splitKey;
    if(key && game.split.active!==key){ game.split.active=key; playTeleport(); drawBlock(); } return true; } /* SFX: 전환 */
  return false;
}
const app=document.getElementById('app'); let sx0=0,sy0=0,tr=false;
function screenDir(dr,dc){ const p0=new THREE.Vector3(0,.5,0).project(camera); const p1=new THREE.Vector3(dc,.5,dr).project(camera); return {x:p1.x-p0.x,y:-(p1.y-p0.y)}; }
function swipe(dx,dy){ const TH=22; if(Math.abs(dx)<TH&&Math.abs(dy)<TH)return;
  const cand=[['U',screenDir(-1,0)],['D',screenDir(1,0)],['L',screenDir(0,-1)],['R',screenDir(0,1)]];
  const len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len; let best=null,bd=-1e9;
  for(const[d,v]of cand){ const vl=Math.hypot(v.x,v.y); const dot=(ux*v.x+uy*v.y)/vl; if(dot>bd){bd=dot;best=d;} }
  tryMove(best); }
app.addEventListener('touchstart',e=>{const t=e.touches[0];sx0=t.clientX;sy0=t.clientY;tr=true;},{passive:true});
app.addEventListener('touchend',e=>{ if(!tr)return; tr=false; const t=e.changedTouches[0];
  const dx=t.clientX-sx0, dy=t.clientY-sy0;
  if(Math.abs(dx)<12&&Math.abs(dy)<12){ if(pickCube(t.clientX,t.clientY))return; }
  swipe(dx,dy);
},{passive:true});
app.addEventListener('click',e=>{ pickCube(e.clientX,e.clientY); });

document.addEventListener('touchmove',e=>{ if(e.target.closest('#stageGridWrap'))return; e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('wheel',e=>{ if(e.target.closest('#stageGridWrap'))return; e.preventDefault(); },{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
addEventListener('resize',()=>{ if(!lobbyScreen.classList.contains('hidden'))fitLogo(); });

/* ==========================================================================
   BOOT
   ========================================================================== */
initThree();
initStaticLabels();
stepDelay=SPEEDS[SAVE.speed!=null?SAVE.speed:1].d;
goLobby();
loop();
</script>
