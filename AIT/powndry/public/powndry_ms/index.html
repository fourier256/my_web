function activate_chunk(x, y) { if (!inside(x, y)) return; const cx = Math.floor(x / CHUNK_SIZE); const cy = Math.floor(y / CHUNK_SIZE); next_active_chunks.add(`${cx},${cy}`); if (x % CHUNK_SIZE === 0 && cx > 0) next_active_chunks.add(`${cx - 1},${cy}`); if ((x + 1) % CHUNK_SIZE === 0 && cx < cw - 1) next_active_chunks.add(`${cx + 1},${cy}`); if (y % CHUNK_SIZE === 0 && cy > 0) next_active_chunks.add(`${cx},${cy - 1}`); if ((y + 1) % CHUNK_SIZE === 0 && cy < ch - 1) next_active_chunks.add(`${cx},${cy + 1}`); }

function set_cell(x, y, t) {
    if (!inside(x, y)) return;
    const old_t = grid[x][y];
    if (old_t === t) return;
    const coord = `${x},${y}`;
    
    const active_map = { [FIRE]: fire_cells, [SMOKE]: smoke_cells, [ICE]: ice_cells, [PLANT]: plant_cells, [WOOD]: wood_cells, [TNT]: tnt_cells, [SHEEP]: sheep_cells, [WOLF]: wolf_cells, [BIRD]: bird_cells, [FISH]: fish_cells, [WATERFALL]: waterfall_cells, [BLOOD]: blood_cells };
    if (active_map[old_t]) active_map[old_t].delete(coord);
    
    grid[x][y] = t;
    if (active_map[t]) active_map[t].add(coord);
    
    if (t === FIRE) life[x][y] = 20 + randint(0, 20);
    else if (t === SMOKE) life[x][y] = 45 + randint(0, 35);
    else if ((t === BOMB || t === TNT) && life[x][y] > 0) {} 
    else if (t === BLOOD) life[x][y] = 20 + randint(0, 10);
    else life[x][y] = 0;
    
    activate_chunk(x, y);
}

function swap(x1, y1, x2, y2) {
    [grid[x1][y1], grid[x2][y2]] = [grid[x2][y2], grid[x1][y1]]; [life[x1][y1], life[x2][y2]] = [life[x2][y2], life[x1][y1]];
    activate_chunk(x1, y1); activate_chunk(x2, y2);
    const t1 = grid[x1][y1], t2 = grid[x2][y2]; const coord1 = `${x1},${y1}`, coord2 = `${x2},${y2}`;
    
    const active_map = { [FIRE]: fire_cells, [SMOKE]: smoke_cells, [ICE]: ice_cells, [PLANT]: plant_cells, [WOOD]: wood_cells, [TNT]: tnt_cells, [SHEEP]: sheep_cells, [WOLF]: wolf_cells, [BIRD]: bird_cells, [FISH]: fish_cells, [WATERFALL]: waterfall_cells, [BLOOD]: blood_cells };
    
    if (active_map[t1]) { active_map[t1].delete(coord2); active_map[t1].add(coord1); }
    if (active_map[t2]) { active_map[t2].delete(coord1); active_map[t2].add(coord2); }
}

function try_powder(x,y){const ny=y-1;const valid_swap=[EMPTY,WATER,OIL,SMOKE];if(inside(x,ny)&&valid_swap.includes(grid[x][ny])){swap(x,y,x,ny);return} const d=randint(0,1)===0?-1:1;let nx=x+d;if(inside(nx,ny)&&valid_swap.includes(grid[nx][ny])){swap(x,y,nx,ny);return} nx=x-d;if(inside(nx,ny)&&valid_swap.includes(grid[nx][ny])){swap(x,y,nx,ny)}}
function try_liquid(x,y,spread){const ny=y-1;if(inside(x,ny)&&grid[x][ny]===EMPTY){swap(x,y,x,ny);return} const d=randint(0,1)===0?-1:1;let nx=x+d;if(inside(nx,ny)&&grid[nx][ny]===EMPTY){swap(x,y,nx,ny);return} nx=x-d;if(inside(nx,ny)&&grid[nx][ny]===EMPTY){swap(x,y,nx,ny);return} for(let i=1;i<=spread;i++){nx=x+d*i;if(inside(nx,y)){if(grid[nx][y]===EMPTY){swap(x,y,nx,y);return}else{break}}}}

function paint_brush(gx, gy, t) {
    const r = brush_size;
    const creatures = [SHEEP, WOLF, BIRD, FISH]; // 밀도 조절이 필요한 생물 목록

    for (let dx = -r; dx <= r; dx++) {
        for (let dy = -r; dy <= r; dy++) {
            if (dx * dx + dy * dy <= r * r) {
                // 선택된 재료가 생물 목록에 포함되는지 확인
                if (creatures.includes(t)) {
                    // 30% 확률로만 생성을 시도합니다.
                    // 이 값을 조절하여 밀도를 변경할 수 있습니다. (예: 10으로 하면 더 뜸하게 생성)
                    if (randint(0, 100) < 3) {
                        set_cell(gx + dx, gy + dy, t);
                    }
                } else {
                    // 생물이 아니면 (모래, 물 등) 항상 생성합니다.
                    set_cell(gx + dx, gy + dy, t);
                }
            }
        }
    }
}

// *** NEW: 재사용 가능한 헬퍼 함수 ***
function create_explosion(x, y, radius) {
    g_explosions_this_frame.push({ "x": x, "y": y, "radius": radius });
    for (let r = radius; r > 0; r--) {
        const num_steps = Math.floor(r * 2 * Math.PI) || 1;
        for (let i = 0; i < num_steps; i++) {
            const angle = (i / num_steps) * 2 * Math.PI;
            const px = x + Math.round(r * Math.cos(angle));
            const py = y + Math.round(r * Math.sin(angle));
            if (!inside(px, py)) continue;
            const p = grid[px][py];
            if ([EMPTY, STONE].includes(p)) continue;
            const dist_ratio = r / radius;
            if (dist_ratio < 0.4 && Math.random() < 0.8) {
                set_cell(px, py, Math.random() < 0.5 ? FIRE : SMOKE);
                continue;
            }
            if (Math.random() < 1.2 - dist_ratio) {
                const force = Math.floor((1 - dist_ratio) * radius * 0.8) + 1;
                const dir_x = px - x + randint(-2, 2);
                const dir_y = py - y + randint(-2, 2);
                const tx = px + Math.round((dir_x / r) * force);
                const ty = py + Math.round((dir_y / r) * force);
                if (inside(tx, ty) && grid[tx][ty] === EMPTY) swap(px, py, tx, ty);
            }
        }
    }
}

function update_wolf(x, y) {

        return;

    // 4. 사냥감(양) 찾기
    const search_radius = 4;

function randint(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function sample(array, count) {
    const shuffled = [...array].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count);
}

function inside(x, y) {
    return x >= 0 && x < gw && y >= 0 && y < gh;
}

function mouse_to_grid() {
    return [Math.floor((mouse.x - xmin) / cell), Math.floor((mouse.y - ymin) / cell)];
