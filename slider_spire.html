<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Slider Spire — 2048 덱빌딩 던전</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== 에러 팝업 (인라인) ===== */
#errOverlay{ position:fixed; inset:0; z-index:99999; display:none; background:rgba(0,0,0,.72); align-items:center; justify-content:center; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
#errOverlay.on{ display:flex; }
#errBox{ max-width:86%; max-height:80%; overflow:auto; background:#1c1f26; border:2px solid #ff5a5a; border-radius:14px; padding:22px 24px; color:#fff; box-shadow:0 12px 40px #000a; }
#errBox h2{ margin:0 0 12px; color:#ff7a7a; font-size:22px; }
#errBox pre{ white-space:pre-wrap; word-break:break-word; margin:0 0 16px; font-size:15px; line-height:1.5; color:#ffd7d7; background:#000; padding:12px 14px; border-radius:8px; }
#errBox .errBtns{ display:flex; gap:10px; justify-content:flex-end; }
#errBox button{ font-size:16px; padding:9px 16px; border-radius:8px; border:0; cursor:pointer; background:#3a3f4b; color:#fff; }
#errBox button.primary{ background:#ff5a5a; }

/* ===== 4클래스 아키타입 / 상태 카드 보조 스타일 ===== */
#archRow{flex-wrap:wrap;justify-content:center}
#archSelect{overflow-y:auto}
.archCard.iron_strength,.archCard.iron_block,.archCard.iron_exhaust,.archCard.iron_blood{border-top:6px solid #c0392b}
.archCard.sil_poison,.archCard.sil_shiv,.archCard.sil_discard,.archCard.sil_shadow{border-top:6px solid #27ae60}
.archCard.def_frost,.archCard.def_lightning,.archCard.def_claw,.archCard.def_echo{border-top:6px solid #2f80ed}
.archCard.wat_stance,.archCard.wat_mantra,.archCard.wat_block,.archCard.wat_rushdown{border-top:6px solid #8e44ad}
.hcard.statusCard{filter:grayscale(.6) brightness(.75)}
/* ===== 미니언(공방 통합 타일) 보조 스타일 ===== */
.fcard.minion{border:2px solid #d4b45a}
.fcard.minion .mstat{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:8px;font-size:20px;font-weight:700}
.fcard.minion .mstat .matk{color:#ffb56b}
.fcard.minion .mstat .mdef{color:#7ec8ff}
.bslot.sacrific{outline:3px solid #ff5a5a;outline-offset:-3px;border-radius:8px}
</style>
</head>
<body>
<div id="stage"><div id="game">
  <div id="topbar">
    <div id="bossName">보스 · <b id="bossTitle">용용이</b> <span id="phaseTag">[1 페이즈]</span></div>

  <div id="archSelect">

  <div id="mapScreen">
    <div id="mapHud">
      <span class="mHp">❤ <b id="mapHp">48/48</b></span>

<div id="errOverlay">
  <div id="errBox">
    <h2>⚠️ 오류가 발생했습니다</h2>
    <pre id="errText"></pre>
    <div class="errBtns"><button id="errCopy">복사</button><button id="errClose" class="primary">닫기</button></div>
  </div>
</div>

<script>
/* ===================================================================
   에러 팝업
=================================================================== */
(function(){
  const overlay=document.getElementById("errOverlay");
  const textEl=document.getElementById("errText");
  window.showError=function(msg){
    const stamp=new Date().toLocaleTimeString();
    const line=`[${stamp}] ${msg}`;
    textEl.textContent = overlay.classList.contains("on") ? (textEl.textContent + "\n\n" + line) : line;
    overlay.classList.add("on");
  };
  document.getElementById("errClose").addEventListener("click",()=>{ overlay.classList.remove("on"); textEl.textContent=""; });
  document.getElementById("errCopy").addEventListener("click",()=>{ const t=textEl.textContent; if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{}); });
  window.addEventListener("error",e=>{ const m=e.error && e.error.stack ? e.error.stack : (e.message || String(e)); showError("JS 오류:\n"+m); });
  window.addEventListener("unhandledrejection",e=>{ const r=e.reason; const m=r && r.stack ? r.stack : (r && r.message ? r.message : String(r)); showError("처리되지 않은 Promise 거부:\n"+m); });
})();

/* ===== 제스처 차단 ===== */
document.addEventListener("touchstart", e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener("touchmove",  e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
document.addEventListener("gesturestart",  e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
document.addEventListener("gestureend",    e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener("touchend", e=>{ const now=Date.now(); if(now-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=now; }, {passive:false});
document.addEventListener("dblclick", e=>e.preventDefault());
document.addEventListener("selectstart", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("wheel", e=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});

/* ===== 리소스 URL ===== */
const MON="https://raw.githubusercontent.com/crawl/tiles/master/releases/Ancient/Oct-5-2010/dc-mon/";
const IC="https://raw.githubusercontent.com/game-icons/icons/master/";
const BOSS_IMG=MON+"dragon.png";
const SWORD=IC+"lorc/pointy-sword.svg";
const SHIELD=IC+"sbed/shield.svg";

/* ===== 18×32 그리드 ===== */
const STAGE_W=1080, STAGE_H=1920;
const GRID_COLS=18, GRID_ROWS=32;
const CW=STAGE_W/GRID_COLS;
const CH=STAGE_H/GRID_ROWS;
function GX(col){ return (col-1)*CW; }
function GY(row){ return (row-1)*CH; }
function gridArea(colA,rowA,colB,rowB){ return { left:GX(colA), top:GY(rowA), w:(colB-colA+1)*CW, h:(rowB-rowA+1)*CH }; }
function placeGrid(el, colA,rowA,colB,rowB){ const a=gridArea(colA,rowA,colB,rowB); el.style.left=a.left+"px"; el.style.top=a.top+"px"; el.style.width=a.w+"px"; el.style.height=a.h+"px"; return a; }
const CELL_W = 3*CW;   // 180
const CELL_H = 3*CH;   // 180

/* ===== 파라미터 ===== */
let PARAMS = {};
let MON_FILES = [];
let SLIDE_COST_V = 2;      // 상하 슬라이드 마나 비용 (좌우는 0)
let MERGE_CAP = 16;
let FCOLS=4, FROWS=2, BCOLS=4, BROWS=4;
let GAME_CONFIG = {};
let ENEMY_PHASES = [];
let CARD_HALF = 100;
const FIXED_MANA = 6;      // ★ 마나 6 고정

let CUR_ENEMY = null;

let CARDS={}, DECKS={};
function cardCost(def){ return def.cost; }
function iconURL(def){ return IC+def.icon; }
function hasKW(def,kw){ return def.kw && def.kw.includes(kw); }

/* ===================================================================
   [런 상태]
=================================================================== */
const RUN = {
  arch:null, deckList:[], hp:0, maxHp:0, gold:0,
  map:null, curNodeId:null, finished:false
};

/* ===== 데이터 로딩 ===== */
async function loadData(){
  try {
    const [paramsRes, cardsRes, deckRes] = await Promise.all([
      fetch("./assets/params.json",{cache:"no-store"}),
      fetch("./assets/cards.json",{cache:"no-store"}),
      fetch("./assets/template_deck.json",{cache:"no-store"})
    ]);
    if(!paramsRes.ok) throw new Error("params.json HTTP "+paramsRes.status);
    if(!cardsRes.ok) throw new Error("cards.json HTTP "+cardsRes.status);
    if(!deckRes.ok)  throw new Error("template_deck.json HTTP "+deckRes.status);

    const paramsData = await paramsRes.json();
    const cardsData = await cardsRes.json();
    const deckData = await deckRes.json();

    PARAMS = paramsData;
    GAME_CONFIG = PARAMS.game || {};
    const boardConfig = PARAMS.board || {};
    const enemyConfig = PARAMS.enemy || {};

    FCOLS = boardConfig.fieldCols || 4;
    FROWS = boardConfig.fieldRows || 2;
    BCOLS = boardConfig.boardCols || 4;
    BROWS = boardConfig.boardRows || 4;
    SLIDE_COST_V = boardConfig.slideCostVertical!=null ? boardConfig.slideCostVertical : 2;
    MERGE_CAP = boardConfig.mergeLimit || 16;
    MON_FILES = enemyConfig.files || [];
    ENEMY_PHASES = enemyConfig.phases || [];

    CARDS = cardsData.cards || {};
    DECKS = deckData.decks || {};
    for(const k in CARDS){
      const c = CARDS[k];
      if(!c.kw) c.kw = [];
      /* 새 규칙: 카드는 타일을 놓지 않고, 코스트=희생할 미니언 val */
      c.placesTile = false;
      if(c.exhaust === undefined) c.exhaust = false;
    }
    validateDecks();
  } catch(err) { showLoadError(err); throw err; }
}

async function loadEnemy(enemyId){
  const fallback = {
    files: (PARAMS.enemy && PARAMS.enemy.files) || MON_FILES,
    phases: (PARAMS.enemy && PARAMS.enemy.phases) || ENEMY_PHASES,
    bossImg: BOSS_IMG, bossTitle: "용용이",
    maxPhases: (GAME_CONFIG.maxPhases || 4)
  };
  if(!enemyId) return fallback;
  try{
    const res = await fetch(`./assets/enemies/${enemyId}.json`, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();
    return {
      files:  d.files  || fallback.files,
      phases: d.phases || fallback.phases,
      bossImg: d.bossImg ? (d.bossImg.startsWith("http")? d.bossImg : MON+d.bossImg) : fallback.bossImg,
      bossTitle: d.bossTitle || fallback.bossTitle,
      maxPhases: d.maxPhases || (d.phases ? d.phases.length : fallback.maxPhases)
    };
  }catch(e){ return fallback; }
}

function validateDecks(){
  const missing=[];
  for(const dk in DECKS){
    const t=DECKS[dk];
    (t.cards||[]).forEach(entry=>{ if(!CARDS[entry.id] && !missing.some(m=>m.deck===dk && m.id===entry.id)){ missing.push({deck:dk, id:entry.id}); } });
  }
  if(missing.length){
    const lines=missing.map(m=>` · 덱 "${m.deck}" 의 카드 id "${m.id}" 가 cards.json 에 없음`).join("\n");
    showError("덱 데이터 오류:\n"+lines);
  }
}
function showLoadError(err){
  const el=document.getElementById("loadMsg");
  el.classList.remove("hidden");
  el.innerHTML=`<div><b>데이터를 불러오지 못했습니다.</b><br><br><code>assets/</code> 폴더 확인, 로컬 서버(<code>python -m http.server</code>)로 실행하세요.<br><br><span style="color:#ff8a5a;font-size:20px">(${(err&&err.message)||err})</span></div>`;
  showError("데이터 로드 실패:\n"+((err&&err.message)||err));
}

function getPhaseData(p) {
  const phases = (CUR_ENEMY && CUR_ENEMY.phases) || ENEMY_PHASES;
  const idx = p - 1;
  if (idx >= 0 && idx < phases.length) return phases[idx];
  return { bossHp: 100, bossAttack: 20, spawnHp: 30, spawnAtk: 10 };
}

function fieldSlotLocal(r,c){ return { left:c*CELL_W, top:r*CELL_H, w:CELL_W, h:CELL_H }; }
function boardSlotLocal(r,c){ return { left:c*CELL_W, top:r*CELL_H, w:CELL_W, h:CELL_H }; }

/* ===== 전투 상태 변수 ===== */
let field,board,deck,hand,discard,exhaustPile,mana,maxMana,hp,maxHp,bossHp,bossMax,turnCount,
    colDef,busy,bossIntent,bossStun,strength,tempStrMult,thornsOn,blockedThisTurn,phase,maxPhases;

let keepDefNext=0, evadeCols=new Set(), capNextDmg=null, dmgDealtThisTurn=0, lifestealPct=0, pendingHandNextTurn=[];

const stageEl=document.getElementById("stage"),
      gameEl=document.getElementById("game"),
      fieldEl=document.getElementById("field"), boardEl=document.getElementById("board"),
      handEl=document.getElementById("hand"), colStatsEl=document.getElementById("colStats"),
      bossIntentEl=document.getElementById("bossIntent"), buffBarEl=document.getElementById("buffBar"),
      buffTipEl=document.getElementById("buffTip");

function resize(){ const s=Math.min(innerWidth/1080,innerHeight/1920); stageEl.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener("resize",resize); resize();
function stageScale(){ return Math.min(innerWidth/1080,innerHeight/1920); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ===================================================================
   [화면 전환]
=================================================================== */
function showScreen(name){
  const map=document.getElementById("mapScreen");
  const reward=document.getElementById("rewardScreen");
  const rest=document.getElementById("restScreen");
  const arch=document.getElementById("archSelect");
  const dvBtn=document.getElementById("deckViewBtn");
  [map,reward,rest,arch].forEach(el=>el.classList.remove("on"));
  arch.style.display = (name==="arch") ? "flex" : "none";
  if(name==="map") map.classList.add("on");
  if(name==="reward") reward.classList.add("on");
  if(name==="rest") rest.classList.add("on");
  dvBtn.style.display = (name==="map") ? "flex" : "none";
}

function buildDeckFromList(list){ const d=list.slice(); shuffle(d); return d; }

/* ===== 아키타입 선택 ===== */
function initArchSelect(){
  const row=document.getElementById("archRow"); row.innerHTML="";
  for(const key in DECKS){
    const t=DECKS[key];
    const el=document.createElement("div");
    el.className="archCard "+key; el.dataset.arch=key;
    el.innerHTML=`<div class="aTitle">${t.label||key}</div><div class="aIcon">${t.icon||"🎴"}</div><div class="aDesc">${t.desc||""}</div>`;
    el.addEventListener("click",()=>{ startRun(key); });
    row.appendChild(el);
  }
}

function startRun(arch){
  RUN.arch=arch;
  const t=DECKS[arch];
  const list=[]; (t.cards||[]).forEach(entry=>{ const n=entry.count||1; for(let i=0;i<n;i++) list.push(entry.id); });
  RUN.deckList=list;
  RUN.maxHp = GAME_CONFIG.initialHp || 48;
  RUN.hp = RUN.maxHp;
  RUN.gold = 0; RUN.finished=false;
  RUN.map = generateMap();
  RUN.curNodeId = null;
  showScreen("map"); renderMap();
}

/* ===================================================================
   [맵 생성]
=================================================================== */
function generateMap(){
  const FLOORS = 9; const rows=[]; let idc=0;
  for(let r=0;r<FLOORS;r++){
    let count;
    if(r===FLOORS-1) count=1;
    else if(r===0) count=2 + (Math.random()*2|0);
    else count=2 + (Math.random()*3|0);
    const nodes=[];
    for(let c=0;c<count;c++){ nodes.push({ id:idc++, row:r, col:c, type:null, enemyId:null, next:[], visited:false, cleared:false }); }
    rows.push(nodes);
  }
  rows.forEach((nodes,r)=>{
    nodes.forEach(n=>{
      if(r===rows.length-1){ n.type="boss"; n.enemyId="enemy_boss"; return; }
      if(r===0){ n.type="battle"; n.enemyId=pickEnemyId(r); return; }
      const roll=Math.random();
      if(r>=2 && roll<0.15){ n.type="rest"; }
      else if(roll<0.28){ n.type="treasure"; }
      else { n.type="battle"; n.enemyId=pickEnemyId(r); }
    });
  });
  for(let r=0;r<rows.length-1;r++){
    const cur=rows[r], nxt=rows[r+1];
    cur.forEach(n=>{
      const ratio = cur.length>1 ? n.col/(cur.length-1) : 0.5;
      let base = Math.round(ratio*(nxt.length-1));
      const targets=new Set();
      targets.add(clamp(base,0,nxt.length-1));
      if(Math.random()<0.5){ targets.add(clamp(base+(Math.random()<0.5?-1:1),0,nxt.length-1)); }
      n.next=[...targets];
    });
    nxt.forEach((m,ci)=>{
      const hasParent = cur.some(n=>n.next.includes(ci));
      if(!hasParent){
        let best=cur[0], bestD=1e9;
        cur.forEach(n=>{ const d=Math.abs((n.col/(Math.max(1,cur.length-1))) - (m.col/(Math.max(1,nxt.length-1)))); if(d<bestD){bestD=d;best=n;} });
        best.next.push(ci);
      }
    });
  }
  return { rows };
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
let __enemyCounter=0;
function pickEnemyId(row){ const id="enemy_"+String(__enemyCounter%3).padStart(2,"0"); __enemyCounter++; return id; }

/* ===================================================================
   [맵 렌더]
=================================================================== */
const mapNodesEl=document.getElementById("mapNodes");
const mapEdgesEl=document.getElementById("mapEdges");
const mapScrollEl=document.getElementById("mapScroll");
function nodeById(id){ for(const row of RUN.map.rows) for(const n of row) if(n.id===id) return n; return null; }
function selectableNodeIds(){
  if(RUN.curNodeId==null){ return new Set(RUN.map.rows[0].map(n=>n.id)); }
  const cur=nodeById(RUN.curNodeId);
  const nextRow=RUN.map.rows[cur.row+1]||[];
  return new Set((cur.next||[]).map(ci=>nextRow[ci]?nextRow[ci].id:null).filter(x=>x!=null));
}
function nodeIcon(type){ return type==="battle"?"⚔️" : type==="boss"?"🐉" : type==="rest"?"🔥" : type==="treasure"?"🎁" : "❓"; }
function renderMap(){
  document.getElementById("mapHp").textContent=`${RUN.hp}/${RUN.maxHp}`;
  document.getElementById("mapGold").textContent=RUN.gold;
  document.getElementById("mapDeck").textContent=RUN.deckList.length;
  const curRow = RUN.curNodeId==null ? 0 : (nodeById(RUN.curNodeId).row+1);
  document.getElementById("mapFloorLabel").textContent=(Math.min(curRow+1,RUN.map.rows.length))+"층 / "+RUN.map.rows.length;
  const rows=RUN.map.rows;
  const W=1080, colGapTop=40, rowH=180;
  const totalH = rows.length*rowH + colGapTop*2;
  mapScrollEl.style.height=totalH+"px";
  mapEdgesEl.setAttribute("width", W); mapEdgesEl.setAttribute("height", totalH);
  rows.forEach((nodes,r)=>{
    const y = totalH - colGapTop - (r*rowH) - rowH/2;
    nodes.forEach((n,ci)=>{ const x = W*( (ci+1)/(nodes.length+1) ); n.x=x; n.y=y; });
  });
  let svg="";
  for(let r=0;r<rows.length-1;r++){
    const nxt=rows[r+1];
    rows[r].forEach(n=>{ (n.next||[]).forEach(ci=>{ const m=nxt[ci]; if(!m) return; svg+=`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" stroke="#5a4a7a" stroke-width="4" stroke-linecap="round"/>`; }); });
  }
  mapEdgesEl.innerHTML=svg;
  const sel=selectableNodeIds();
  mapNodesEl.innerHTML="";
  rows.forEach(nodes=>{
    nodes.forEach(n=>{
      const el=document.createElement("div");
      el.className="mapNode t-"+n.type;
      if(n.cleared) el.classList.add("cleared");
      if(RUN.curNodeId===n.id) el.classList.add("current");
      const can = sel.has(n.id) && !RUN.finished;
      if(can) el.classList.add("selectable");
      el.style.left=(n.x)+"px"; el.style.top=(n.y)+"px";
      el.innerHTML=`<span class="mnIcon">${nodeIcon(n.type)}</span>`;
      if(can){ el.addEventListener("click",()=>enterNode(n.id)); }
      mapNodesEl.appendChild(el);
    });
  });
  requestAnimationFrame(()=>{
    let ty=totalH;

/* ===== 미니언 헬퍼 ===== */
function hasMinionWithVal(v){ for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c]; if(f && f.val===v) return true; } return false; }
function minionsWithVal(v){ const arr=[]; for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c]; if(f && f.val===v) arr.push({r,c,f}); } return arr; }
/* 랜덤 빈칸에 미니언 1개 생성 (시작 시드 + 상하 슬라이드 공용) */
function spawnMinionRandom(val){
  const empties=[];
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++) if(!board[r][c]) empties.push([r,c]);
  if(!empties.length) return null;
  const [r,c]=empties[Math.random()*empties.length|0];
  board[r][c]={val:val,el:null};
  return [r,c];
}

async function startTurn(){
  turnCount++;
  if(keepDefNext>0){ keepDefNext--; } else { colDef=Array(BCOLS).fill(0); }
  thornsOn=false; blockedThisTurn=0; tempStrMult=1; evadeCols=new Set(); capNextDmg=null; dmgDealtThisTurn=0; lifestealPct=0;
  maxMana=FIXED_MANA; mana=maxMana;      // ★ 마나 6 고정 (성장 없음)
  decideBossIntent();
  renderCards(); renderColStats(); renderStrBadge(); renderBuffs(); updateHUD();
  await drawCards(GAME_CONFIG.cardsPerTurn || 5);
  if(pendingHandNextTurn.length){ const ids=pendingHandNextTurn.slice(); pendingHandNextTurn.length=0; for(const id of ids){ await drawSpecific(id); } layoutHand(); updateHUD(); }
}

document.getElementById("endTurnBtn").addEventListener("click",endTurn);

/* ===================================================================
   [턴 종료] 정산 순서: 방어 → 적 공격(초과분 명치) → 미니언 개별 반격
=================================================================== */
async function endTurn(){
  if(busy)return; busy=true; hideBossIntent(); hideBuffTip();
  try {
    await defenseResolve();          // (1) 모든 미니언 val 합산 → colDef
    await enemyAttackResolve();      // (2) 일반 몹 + 보스 공격, 초과분 명치
    if(hp<=0){ battleLost(); return; }
    await minionAttackResolve();     // (3) 미니언 개별 반격 (아래→위)
    if(lifestealPct>0 && dmgDealtThisTurn>0){ const healed=Math.floor(dmgDealtThisTurn*lifestealPct/100); if(healed>0){ hp=Math.min(maxHp,hp+healed); dmgPop(hpBadgeEl(),"🧛+"+healed,"#8affa0"); updateHUD(); await sleep(200); } }
    if(bossHp<=0){ await nextPhaseOrWin(); if(phase>maxPhases){ return; } }
    refreshDestroyTarget(); clearBossMarks();
    await discardHand();
    await enemyPhaseSetup();          // 다음 턴 의도/소환/전진
    await startTurn();
  } catch(err) { showError("endTurn 오류:\n"+(err&&err.stack?err.stack:err)); }
  finally { busy=false; }
}

/* (1) 방어: 모든 미니언 val을 그 열 방어력에 합산 */
async function defenseResolve(){
  for(let c=0;c<BCOLS;c++){
    for(let r=0;r<BROWS;r++){
      const f=board[r][c];
      if(f){ punch(f.el); colDef[c]+=f.val; defGainAnim(c); dmgPop(f.el,"+"+f.val+"🛡","#7ec8ff"); renderColStats(); await sleep(110); }
    }
  }
}

/* (2) 적 공격: 일반 몹은 자기 열, 보스는 intent(cols)대로. colDef로 막고 초과분 hp */
function hitColumn(c, dmg, srcEl){
  if(evadeCols.has(c)){ dmgPop(document.getElementById("hpBadge"),"💨회피!","#bfe4ff"); return; }
  if(capNextDmg!=null){ dmg=Math.min(dmg,capNextDmg); capNextDmg=null; renderBuffs(); }
  let remain=dmg; const useDef=Math.min(colDef[c],remain); colDef[c]-=useDef; remain-=useDef;
  if(useDef>0){ defHitAnim(c); blockedThisTurn+=useDef; }
  renderColStats();
  if(remain>0){ hp-=remain; redFlash(); centerDmg(remain); dmgPop(document.getElementById("hpBadge"),"-"+remain,"#ff5a5a"); }
  else { dmgPop(document.getElementById("hpBadge"),"방어!","#7ec8ff"); }
  if(thornsOn && useDef>0){ bossHp-=useDef; bossHurt(); dmgPop(document.getElementById("bossArt"),"⟳-"+useDef,"#9cff5a"); }
  updateHUD();
}
async function enemyAttackResolve(){
  showBanner("적의 턴"); await sleep(300);
  /* (2-a) 일반 몬스터: 각자 자기 열을 상시 공격 */
  for(let r=FROWS-1;r>=0;r--){
    for(let c=0;c<FCOLS;c++){
      const e=field[r][c];
      if(e){
        if(e.stun>0){ e.stun=0; e.el&&e.el.classList.remove("stunned"); dmgPop(e.el,"기절!","#ffec5a"); await sleep(180); }
        else { punch(e.el); hitColumn(c, e.atk, e.el); await sleep(260); if(hp<=0) return; }
      }
    }
  }
  /* (2-b) 보스: intent 에 따라 특정/다중 열 특수공격 */
  if(bossStun>0){ bossStun=0; renderBossStun(); dmgPop(document.getElementById("bossArt"),"기절!","#ffec5a"); await sleep(200); }
  else if(bossIntent && bossIntent.type==="attack"){
    const art=document.getElementById("bossArt"); const pData=getPhaseData(phase);
    for(const c of (bossIntent.cols||[])){ punch(art); hitColumn(c, bossIntent.val!=null?bossIntent.val:pData.bossAttack, null); await sleep(280); if(hp<=0) return; }
  } else if(bossIntent && bossIntent.type==="destroy"){
    const art=document.getElementById("bossArt"); punch(art);
    let targets=(bossIntent.targets||[]);
    if(!targets.length || targets.some(h=>!board[h.r]||!board[h.r][h.c])) targets=highestCards(phase);
    for(const h of targets){ if(h && board[h.r] && board[h.r][h.c]){ destroyCard(h.r,h.c); await sleep(200); } }
    renderColStats();
  }
}

/* (3) 미니언 개별 반격: 아래→위, 각자 자기 열 최하단 적(없으면 보스) 타격 */
async function minionAttackResolve(){
  for(let c=0;c<BCOLS;c++){
    for(let r=BROWS-1;r>=0;r--){
      const f=board[r][c];
      if(f){ punch(f.el); await sleep(120); dealToColumn(c, f.val + effStrength()); await sleep(160); if(bossHp<=0) return; }
    }
  }
}

/* ===== 페이즈 전환 / 전투 승리 ===== */
async function nextPhaseOrWin(){
  if(phase>=maxPhases){ await battleWon(); phase=maxPhases+1; return; }
  phase++;
  showBanner(phase+"페이즈!"); await sleep(900);
  const pData=getPhaseData(phase); bossMax=pData.bossHp; bossHp=bossMax;
  bossStun=0; renderBossStun(); updatePhaseTag(); updateHUD(); decideBossIntent(); await sleep(300);
}
async function battleWon(){
  hideBossIntent(); clearBossMarks(); showBanner("승리!");
  RUN.hp = Math.max(1, hp);
  const node = nodeById(RUN.curNodeId); if(node) node.cleared=true;
  RUN.gold += 20 + (Math.random()*15|0);
  await sleep(900); showBattleUI(false);
  if(node && node.type==="boss"){ RUN.finished=true; showBanner("최종 승리! 축하합니다"); openRunClear(); return; }
  openReward(true);
}
function battleLost(){
  hideBossIntent(); clearBossMarks(); showBanner("패배...");
  setTimeout(()=>{ if(confirm("패배! 처음부터 다시 시작?")) location.reload(); },800);
}

function rewardPool(){
  const pre=(RUN.arch||"").split("_")[0];
  return Object.keys(CARDS).filter(k=>{
    const def=CARDS[k];
    if(isStatusCard(def)) return false;
    if(k==="strike"||k==="defend") return false;
    const p=k.split("_")[0];
    const cls=({sil:"sil",def:"def",wat:"wat"})[p];
    if(pre==="sil"||pre==="def"||pre==="wat") return cls===pre;
    return !cls;
  });
}
function openReward(canSkip){
  const pool=rewardPool(); shuffle(pool);
  const picks=pool.slice(0,3);
  const row=document.getElementById("rewardRow"); row.innerHTML="";
  picks.forEach(key=>{
    const def=CARDS[key];
    const el=document.createElement("div"); el.className="rwCard "+def.type;
    const kwStr=def.kw&&def.kw.length?def.kw.join(" · "):"";
    const fallbackIcon=SWORD;
    el.innerHTML=`<div class="hcost">${def.cost}</div><div class="htier">희생 ${def.cost}</div>
      <img class="hicon" src="${iconURL(def)}" onerror="this.src='${fallbackIcon}'">
      <div class="hname">${def.name}</div><div class="hdesc">${(def.desc||"").replace(/\n/g,"<br>")}</div>
      ${kwStr?`<div class="hkw">${kwStr}</div>`:""}`;
    el.addEventListener("click",()=>{ RUN.deckList.push(key); closeRewardToMap(); });
    row.appendChild(el);
  });
  const skip=document.getElementById("rewardSkip");
  skip.style.display = canSkip ? "block" : "none";
  skip.onclick = ()=> closeRewardToMap();
  showBattleUI(false); showScreen("reward");
}
function closeRewardToMap(){ showScreen("map"); renderMap(); }

function openRest(node){
  showBattleUI(false); showScreen("rest");
  document.getElementById("restHeal").onclick=()=>{
    const heal=Math.floor(RUN.maxHp*0.3);
    RUN.hp=Math.min(RUN.maxHp, RUN.hp+heal);

function openRunClear(){ setTimeout(()=>{ if(confirm("던전 클리어! 다시 도전?")) location.reload(); }, 1200); }

/* ===== 손패 배치 ===== */
function layoutHand(){
  const n=hand.length; if(n===0) return;
  const areaW=handEl.clientWidth||(12*CW), centerX=areaW/2, maxAngle=Math.min(7,24/Math.max(1,n));
  const cardW=CARD_HALF*2, cardH=cardW*1.42;
  function halfSpan(a){ const t=Math.abs(a)*Math.PI/180; return (cardW/2)*Math.cos(t)+(cardH/2)*Math.sin(t); }
  function fits(sp){ const mid=(n-1)/2; for(let i=0;i<n;i++){ const off=i-mid,x=centerX+off*sp,hs=halfSpan(off*maxAngle); if(x-hs<-0.5||x+hs>areaW+0.5) return false; } return true; }
  let spread=n>1?Math.min(120,(areaW-cardW)/(n-1)):0; while(spread>0&&!fits(spread))spread-=1; if(spread<0)spread=0;
  hand.forEach((h,i)=>{
    if(h.el.classList.contains("dragging")||h.el.classList.contains("zoomed")) return;
    const mid=(n-1)/2,off=i-mid,angle=off*maxAngle; let x=centerX+off*spread; const hs=halfSpan(angle),minX=hs,maxX=areaW-hs;
    if(minX<=maxX){ if(x<minX)x=minX; if(x>maxX)x=maxX; } else x=centerX;
    const lift=Math.abs(off)*Math.abs(off)*4;
    h.el.style.transition="transform .3s cubic-bezier(.2,.8,.3,1),left .3s,bottom .3s,opacity .3s";
    h.el.style.left=x+"px"; h.el.style.bottom=(20-lift)+"px"; h.el.style.transform=`translateX(-${CARD_HALF}px) rotate(${angle}deg)`; h.el.style.zIndex=100+i; h.el.style.opacity="1";
  });
}
async function drawCards(n){
  const maxHand=GAME_CONFIG.maxHandSize||10;
  for(let i=0;i<n;i++){ if(hand.length>=maxHand) break; if(deck.length===0){ deck=discard.slice(); discard=[]; shuffle(deck); } if(deck.length===0){ break; } await drawOne(deck.pop()); }
  layoutHand(); updateHUD();
}
async function drawSpecific(key){ const maxHand=GAME_CONFIG.maxHandSize||10; if(hand.length>=maxHand){ discard.push(key); return; } await drawOne(key); }

async function discardHand(){
  const copy=hand.slice(); hand.length=0;

/* ===================================================================
   [카드 드래그] 새 규칙: 코스트와 같은 val 미니언 위로 드롭 → 그 미니언 희생
=================================================================== */
function attachDrag(card){
  const el=card.el; let ox,oy,dragging=false,holdTimer=null,zoomed=false,startP=null;
  const dim=document.getElementById("zoomDim");
  function pt(e){ return e.touches&&e.touches[0]?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
  function clearHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
  function armHold(){ clearHold(); holdTimer=setTimeout(()=>{ if(dragging){ el.classList.remove("dragging"); highlightValid(card,false); zoomIn(); } },3000); }
  function zoomIn(){ zoomed=true; el.classList.add("zoomed"); dim.classList.add("on"); }
  function zoomOut(){ if(!zoomed) return; zoomed=false; el.classList.remove("zoomed"); dim.classList.remove("on"); }
  function beginDragVisual(){ el.style.transition="none"; el.classList.add("dragging"); el.style.transform=`translateX(-${CARD_HALF}px)`; ox=CARD_HALF; oy=120; }
  function down(e){ if(busy) return; if(!hasMinionWithVal(+el.dataset.cost)){ flashBadge("boardWrap"); banner(el.dataset.cost+" 미니언이 없습니다"); return; } dragging=true; startP=pt(e); beginDragVisual(); const s=stageScale(), st=stageEl.getBoundingClientRect(); setPos(pt(e),s,st); highlightValid(card,true); e.preventDefault(); armHold(); }
  function setPos(p,s,st){ const lx=(p.x-st.left)/s, ly=(p.y-st.top)/s; const handLeft=handEl.offsetLeft; el.style.left=(lx-handLeft)+"px"; el.style.bottom=(1920-ly-(240-oy))+"px"; el.style.transform=`translateX(-${CARD_HALF}px)`; const slot=slotUnder(p.x,p.y); boardEl.querySelectorAll(".bslot").forEach(b=>b.classList.toggle("hover", !!(slot&&b.classList.contains("valid")&&+b.dataset.r===slot.r&&+b.dataset.c===slot.c))); }
  function move(e){ if(!dragging)return; const p=pt(e); if(startP){ const d=Math.hypot(p.x-startP.x,p.y-startP.y); if(d>14){ startP=p; if(zoomed){ zoomOut(); beginDragVisual(); highlightValid(card,true); } armHold(); } } if(zoomed){ if(e.cancelable)e.preventDefault(); return; } const s=stageScale(), st=stageEl.getBoundingClientRect(); setPos(p,s,st); if(e.cancelable)e.preventDefault(); }
  function up(e){ if(!dragging)return; dragging=false; clearHold(); el.classList.remove("dragging"); const wasZoomed=zoomed; zoomOut(); highlightValid(card,false); if(wasZoomed){ layoutHand(); return; } const p=e.changedTouches?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:{x:e.clientX,y:e.clientY}; const slot=slotUnder(p.x,p.y); if(slot && canSacrifice(card,slot.r,slot.c)) doPlayCard(card,slot.r,slot.c); else layoutHand(); }
  card._cleanupDrag=function(){ removeEventListener("mousemove",move); removeEventListener("mouseup",up); removeEventListener("touchmove",move); removeEventListener("touchend",up); clearHold(); };
  el.addEventListener("mousedown",down); addEventListener("mousemove",move); addEventListener("mouseup",up);
  el.addEventListener("touchstart",down,{passive:false}); addEventListener("touchmove",move,{passive:false}); addEventListener("touchend",up);
}
function bslotEl(r,c){ return boardEl.querySelector(`.bslot[data-r="${r}"][data-c="${c}"]`); }
function fslotEl(r,c){ return fieldEl.querySelector(`.fslot[data-r="${r}"][data-c="${c}"]`); }
function slotUnder(px,py){ for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const el=bslotEl(r,c); if(!el) continue; const rc=el.getBoundingClientRect(); if(px>=rc.left&&px<=rc.right&&py>=rc.top&&py<=rc.bottom) return {r,c}; } return null; }
/* 희생 가능: 그 칸에 코스트와 같은 val 미니언이 있어야 함 */
function canSacrifice(card,r,c){ const t=board[r][c]; return !!(t && t.val===+card.el.dataset.cost); }
function highlightValid(card,on){ const need=+card.el.dataset.cost; for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const slot=bslotEl(r,c); const ok=on && board[r][c] && board[r][c].val===need; slot.classList.toggle("valid", !!ok); if(!on)slot.classList.remove("hover"); } }

/* 카드 발동: 미니언 희생 → 효과(희생 미니언 열이 기본 타겟) */
function doPlayCard(card,r,c){
  if(!canSacrifice(card,r,c)){ layoutHand(); return; }
  const i=hand.indexOf(card); if(i>=0) hand.splice(i,1);
  if(card.def.exhaust) exhaustPile.push(card.key); else discard.push(card.key);
  if(card._cleanupDrag) card._cleanupDrag(); card.el.remove(); layoutHand();
  /* 미니언 소모 */
  destroyCard(r,c);
  /* 효과 발동: 기본 타겟 열 = 희생한 미니언의 열 */
  runCardEffect(card.def.__key || card.key, card.def, r, c);
  renderCards(); renderColStats(); renderStrBadge(); renderBuffs(true); renderEnemies(); refreshDestroyTarget(); updateHUD();
}

function runCardEffect(key,def,r,c){ const eff=def.effect; if(!eff) return; if(eff.type==="simple"){ runOps(eff.ops||[],key,def,r,c); } else if(eff.type==="custom"){ runCustom(eff.handler,key,def,r,c); } }

function runOps(ops, key, def, r, c){
  for(const op of ops){
    switch(op.op){
      case "damageColumn": {
        const times=op.times||1; const bonus=op.useStr ? effStrength(op.strMult||1) : 0;
        const targetCol=(op.col!=null)?op.col:c;   // 지정 없으면 희생 미니언 열
        for(let i=0;i<times;i++){
          let amt=op.amount+bonus; const info=peekColumnTarget(targetCol);
          if(op.bonusIfStunned && info && info.isEnemy && info.stunned) amt+=op.bonusIfStunned;
          if(op.bonusIfBackOccupied && info && info.isEnemy && info.backOccupied) amt+=op.bonusIfBackOccupied;
          const res=dealToColumn(targetCol, amt, { stun:!!op.stun, pushBack:op.pushBack||0 });
          if(res && res.killed && op.onKill){ if(op.onKill.healHp){ const b=hp; hp=Math.min(maxHp,hp+op.onKill.healHp); const h=hp-b; if(h>0) dmgPop(hpBadgeEl(),"+"+h,"#8affa0"); } if(op.onKill.draw){ drawCards(op.onKill.draw); } }
        }
        break;
      }
      case "damageAll": { const bonus=op.useStr ? effStrength(op.strMult||1) : 0; for(let rr=0;rr<FROWS;rr++)for(let cc=0;cc<FCOLS;cc++){ if(field[rr][cc]) dealDirect(field[rr][cc], op.amount+bonus, rr, cc); } break; }
      case "addColDef": addColDef(c, op.amount); break;
      case "addAllColDef": for(let cc=0;cc<BCOLS;cc++) addColDef(cc, op.amount); break;
      case "multiplyAllColDef": { const m=op.mult||1; for(let cc=0;cc<BCOLS;cc++){ if(colDef[cc]>0){ colDef[cc]=colDef[cc]*m; defGainAnim(cc); dmgPop(colStatsEl.children[cc],"×"+m,"#7ec8ff"); } } renderColStats(); break; }
      case "addStrength": strength+=op.amount; renderStrBadge(true); dmgPop(strBadge,(op.amount>0?"+":"")+op.amount+"💪","#ffb56b"); break;
      case "setTempStrMult": tempStrMult=op.mult; renderStrBadge(true); dmgPop(strBadge,"힘×"+op.mult,"#ffb56b"); break;
      case "loseHp": hp=Math.max(0,hp-op.amount); if(op.flash) redFlash(); if(op.pop) dmgPop(hpBadgeEl(),"-"+op.amount,"#ff5a5a"); break;
      case "healHp": { const b=hp; hp=Math.min(maxHp,hp+op.amount); const h=hp-b; if(h>0) dmgPop(hpBadgeEl(),"+"+h,"#8affa0"); break; }
      case "gainMana": { const b=mana; mana=Math.min(maxMana,mana+op.amount); const g=mana-b; if(g>0) dmgPop(document.getElementById("manaBadge"),"+"+g,"#7ec8ff"); break; }
      case "draw": drawCards(op.amount); break;
      case "keepDefNextTurn": keepDefNext+=(op.amount||1); dmgPop(colStatsEl.children[c]||hpBadgeEl(),"🏰","#7ec8ff"); break;
      case "evadeColumn": evadeCols.add(c); dmgPop(colStatsEl.children[c]||hpBadgeEl(),"💨회피","#bfe4ff"); break;
      case "capNextDamage": capNextDmg=op.amount; dmgPop(hpBadgeEl(),"🛑기합","#bfe4ff"); break;
      case "lifestealThisTurn": lifestealPct=Math.max(lifestealPct,op.pct||0); dmgPop(hpBadgeEl(),"🧛흡혈","#8affa0"); break;
      case "returnToHandNextTurn": pendingHandNextTurn.push(op.id||key); break;
      case "addCardToHand": pendingHandNextTurn.push(op.id||key); break;
      default: showError("알 수 없는 op: "+op.op+" (카드: "+(def&&def.name||key)+")"); break;
    }
  }
}
function runCustom(handler, key, def, r, c){
  switch(handler){
    case "shieldbash": { const d=colDef[c]; colDef[c]=0; renderColStats(); if(d>0) dealToColumn(c, d+effStrength()); break; }
    case "thorns": { thornsOn=true; dmgPop(hpBadgeEl(),"가시","#8affa0"); break; }
    default: showError("알 수 없는 custom 핸들러: "+handler+" (카드: "+(def&&def.name||key)+")"); break;
  }
}
function hpBadgeEl(){ return document.getElementById("hpBadge"); }
function addColDef(c, amt){ if(amt>0){ colDef[c]+=amt; defGainAnim(c); dmgPop(colStatsEl.children[c],"+"+amt+"🛡","#7ec8ff"); } renderColStats(); }
function destroyCard(r,c){ const t=board[r][c]; if(t){ if(t.el){ t.el.classList.add("destroying"); const el=t.el; setTimeout(()=>el.remove(),400);} board[r][c]=null; } }

function peekColumnTarget(col){ for(let r=FROWS-1;r>=0;r--){ if(field[r][col]){ const backOccupied=(r-1>=0)?!!field[r-1][col]:false; return { isEnemy:true, row:r, stunned:field[r][col].stun>0, backOccupied }; } } return { isEnemy:false }; }
function dealToColumn(col,amt,opt){
  opt=opt||{}; let target=null,tr=-1;
  for(let r=FROWS-1;r>=0;r--){ if(field[r][col]){ target=field[r][col]; tr=r; break; } }
  let killed=false, isEnemy=false;
  if(target){
    isEnemy=true;
    if(amt>0){ target.hp-=amt; dmgDealtThisTurn+=amt; hurt(target.el); slashAtSlot(fslotEl(tr,col),fieldEl); dmgPop(target.el,"-"+amt,"#ffde59"); }
    if(opt.stun){ target.stun=1; if(target.el) target.el.classList.add("stunned"); }
    if(target.hp<=0){ killed=true; killEnemy(target); }
    else if(opt.pushBack && tr-1>=0 && !field[tr-1][col]){ field[tr-1][col]=target; field[tr][col]=null; }
    renderEnemies();
  } else {
    if(amt>0){ bossHp-=amt; dmgDealtThisTurn+=amt; bossHurt(); dmgPop(document.getElementById("bossArt"),"-"+amt,"#ffde59"); }

function dealDirect(target,amt,r,c){ if(!target) return; target.hp-=amt; dmgDealtThisTurn+=amt; hurt(target.el); slashAtSlot(fslotEl(r,c),fieldEl); dmgPop(target.el,"-"+amt,"#ffde59"); if(target.hp<=0) killEnemy(target); renderEnemies(); updateHUD(); }
function killEnemy(e){ for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++) if(field[r][c]===e) field[r][c]=null; if(e.el){ e.el.style.transition="transform .3s,opacity .3s"; e.el.style.transform="scale(0)"; e.el.style.opacity="0"; const el=e.el; setTimeout(()=>el.remove(),300);} }

/* ===================================================================
   [적 페이즈 준비] 다음 턴 의도 결정 + 소환/전진 (공격은 endTurn 정산에서)
=================================================================== */
async function enemyPhaseSetup(){
  if(bossIntent && bossIntent.type==="summon"){
    let cols=(bossIntent.cols||[]).slice();
    for(let i=0;i<cols.length;i++){ if(field[0][cols[i]]){ const alt=openTopCols().find(x=>!cols.includes(x)); if(alt!=null) cols[i]=alt; } }
    for(const col of cols){ if(col!=null && !field[0][col]){ spawnAt(0,col); await sleep(220); } }
  }
  for(let c=0;c<FCOLS;c++){ const e=field[0][c]; if(e && !field[1][c]){ field[1][c]=e; field[0][c]=null; } }
  renderEnemies(); await sleep(200);
}
async function enemyPhase(){ decideBossIntent(); await enemyPhaseSetup(); }

function fieldCount(){ let n=0; for(let r=0;r<FROWS;r++)for(let c=0;c<FCOLS;c++) if(field[r][c]) n++; return n; }
function openTopCols(){ const arr=[]; for(let c=0;c<FCOLS;c++) if(!field[0][c]) arr.push(c); return arr; }
function lowestDefCols(n){ const arr=[]; for(let c=0;c<BCOLS;c++) arr.push({c,d:colDefTotal(c)}); arr.sort((a,b)=>a.d-b.d); return arr.slice(0,n).map(o=>o.c); }
function highestCards(n){ const arr=[]; for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c]; if(f) arr.push({r,c,v:f.val}); } arr.sort((a,b)=>b.v-a.v); return arr.slice(0,n).map(o=>({r:o.r,c:o.c})); }
function decideBossIntent(){
  const aiCfg=PARAMS.ai||{}; const pData=getPhaseData(phase);
  if(bossStun>0){ bossIntent={type:"stunned"}; renderBossIntent(); showBossMarks(); return; }
  const mult=phase, n=fieldCount(); let choices;
  const destroyTh=aiCfg.destroyIfEnemiesMoreThan||3, summonTh=aiCfg.summonIfEnemiesLessThan||2;
  if(n>=destroyTh) choices=["attack","destroy"]; else if(n<=summonTh) choices=["summon"]; else choices=["summon","attack","destroy"];
  const action=choices[Math.random()*choices.length|0];
  if(action==="attack"){ bossIntent={type:"attack", val:pData.bossAttack, cols:lowestDefCols(mult)}; }
  else if(action==="destroy"){ bossIntent={type:"destroy", targets:highestCards(mult)}; }
  else { bossIntent={type:"summon", cols:openTopCols().slice(0,mult)}; }
  renderBossIntent(); showBossMarks();
}
function refreshDestroyTarget(){ if(!bossIntent || bossIntent.type!=="destroy") return; bossIntent.targets=highestCards(phase); showBossMarks(); }
function renderBossIntent(){
  const icon=bossIntentEl.querySelector(".iIcon"), val=bossIntentEl.querySelector(".iVal");
  bossIntentEl.classList.remove("attack","summon","destroy");
  if(!bossIntent){ bossIntentEl.style.display="none"; return; }
  bossIntentEl.style.display="flex"; bossIntentEl.classList.add("pulse");
  if(bossIntent.type==="attack"){ bossIntentEl.classList.add("attack"); icon.textContent="⚔️"; val.textContent=`${bossIntent.val}×${bossIntent.cols.length}`; }
  else if(bossIntent.type==="destroy"){ bossIntentEl.classList.add("destroy"); icon.textContent="💥"; val.textContent=`×${bossIntent.targets.length}`; }
  else if(bossIntent.type==="stunned"){ icon.textContent="😵‍💫"; val.textContent=""; }
  else { bossIntentEl.classList.add("summon"); icon.textContent="🧌"; val.textContent=`×${bossIntent.cols.length}`; }
}
function hideBossIntent(){ bossIntentEl.style.display="none"; bossIntentEl.classList.remove("pulse"); }
function clearBossMarks(){ document.querySelectorAll(".colOverlay,.summonMark,.destroyMark").forEach(e=>e.remove()); }
function showBossMarks(){
  clearBossMarks(); if(!bossIntent) return;
  if(bossIntent.type==="attack"){ (bossIntent.cols||[]).forEach(col=>{ const o=document.createElement("div"); o.className="colOverlay atkLine"; o.style.left=(col*CELL_W)+"px"; o.style.top="0"; o.style.width=CELL_W+"px"; o.style.height=(BROWS*CELL_H)+"px"; boardEl.appendChild(o); }); }
  else if(bossIntent.type==="summon"){ (bossIntent.cols||[]).forEach(col=>{ const p=fieldSlotLocal(0,col); const m=document.createElement("div"); m.className="summonMark"; m.textContent="🧌"; m.style.left=p.left+"px"; m.style.top=p.top+"px"; m.style.width=p.w+"px"; m.style.height=p.h+"px"; fieldEl.appendChild(m); }); }
  else if(bossIntent.type==="destroy"){ (bossIntent.targets||[]).forEach(h=>{ if(h && board[h.r] && board[h.r][h.c]){ const p=boardSlotLocal(h.r,h.c); const m=document.createElement("div"); m.className="destroyMark"; m.textContent="💥"; m.style.left=p.left+"px"; m.style.top=p.top+"px"; m.style.width=p.w+"px"; m.style.height=p.h+"px"; boardEl.appendChild(m); } }); }
}
function spawnAt(r,c,silent){
  const pData=getPhaseData(phase); const files=MON_FILES; if(!files||files.length===0) return;
  const file=files[Math.random()*files.length|0];
  const e={file,hp:pData.spawnHp,maxHp:pData.spawnHp,atk:pData.spawnAtk,stun:0,el:null}; field[r][c]=e;
  if(!silent){ renderEnemies(); if(e.el){ e.el.style.transition="none"; e.el.style.transform="scale(0)"; requestAnimationFrame(()=>{ e.el.style.transition="transform .3s"; e.el.style.transform="scale(1)"; }); } }
}

/* ===================================================================
   [슬라이드] 좌우=무료·생성없음 / 상하=마나2 + 랜덤 2미니언 생성
=================================================================== */
function slide(dir){
  if(busy)return;
  const vertical=(dir==='up'||dir==='down');
  if(vertical && mana<SLIDE_COST_V){ flashBadge("manaBadge"); return; }
  const nb=Array.from({length:BROWS},()=>Array(BCOLS).fill(null));
  function proc(getList,setList){ const K=(dir==='left'||dir==='right')?BROWS:BCOLS; for(let k=0;k<K;k++){ const items=getList(k).filter(x=>x), out=[]; let i=0; while(i<items.length){ if(i+1<items.length && items[i].val===items[i+1].val && items[i].val*2<=MERGE_CAP){ if(items[i].el) items[i].el.remove(); out.push({val:items[i].val*2, el:items[i+1].el, _merged:true}); i+=2; } else { out.push(items[i]); i++; } } setList(k,out); } }
  if(dir==='left') proc(r=>board[r],(r,o)=>{for(let c=0;c<BCOLS;c++)nb[r][c]=o[c]||null;});
  else if(dir==='right') proc(r=>board[r].slice().reverse(),(r,o)=>{for(let c=0;c<BCOLS;c++)nb[r][BCOLS-1-c]=o[c]||null;});
  else if(dir==='up') proc(c=>board.map(row=>row[c]),(c,o)=>{for(let r=0;r<BROWS;r++)nb[r][c]=o[r]||null;});
  else proc(c=>board.map(row=>row[c]).reverse(),(c,o)=>{for(let r=0;r<BROWS;r++)nb[BROWS-1-r][c]=o[r]||null;});
  const before=JSON.stringify(board.map(row=>row.map(x=>x?x.val:0)));
  board=nb;
  const after=JSON.stringify(board.map(row=>row.map(x=>x?x.val:0)));
  if(before===after){ renderCards(); return; }
  if(vertical){ mana-=SLIDE_COST_V; }
  renderCards();
  for(let r=0;r<BROWS;r++)for(let c=0;c<BCOLS;c++){ const f=board[r][c]; if(f&&f._merged){ delete f._merged; if(f.el){ f.el.classList.remove("merged"); void f.el.offsetWidth; f.el.classList.add("merged"); setTimeout(()=>f.el&&f.el.classList.remove("merged"),260); } } }
  /* 상하 슬라이드만 랜덤 빈칸에 2짜리 미니언 생성 */
  if(vertical){
    setTimeout(()=>{
      const pos=spawnMinionRandom(2);
      if(pos){ const nf=board[pos[0]][pos[1]]; renderCards(); if(nf&&nf.el){ nf.el.classList.add("spawning"); setTimeout(()=>nf.el&&nf.el.classList.remove("spawning"),300); } }
      renderColStats(); updateHUD(); refreshDestroyTarget();
    },180);
  }
  renderColStats(); updateHUD(); refreshDestroyTarget();
}

/* ===== 애니메이션 헬퍼 ===== */
function punch(el){ if(!el)return; el.classList.remove("punch"); void el.offsetWidth; el.classList.add("punch"); }
function hurt(el){ if(!el)return; el.classList.remove("hurt"); void el.offsetWidth; el.classList.add("hurt"); setTimeout(()=>el.classList.remove("hurt"),400); }
function slashAtSlot(slotEl,parent){ if(!slotEl) return; const s=document.createElement("div"); s.className="slash"; s.style.left=slotEl.style.left; s.style.top=slotEl.style.top; s.style.width=slotEl.style.width; s.style.height=slotEl.style.height; parent.appendChild(s); setTimeout(()=>s.remove(),320); }
function defHitAnim(c){ const el=colStatsEl.children[c]; if(!el)return; el.classList.remove("defhit"); void el.offsetWidth; el.classList.add("defhit"); setTimeout(()=>el.classList.remove("defhit"),400); }
function defGainAnim(c){ const el=colStatsEl.children[c]; if(!el)return; el.classList.remove("defgain"); void el.offsetWidth; el.classList.add("defgain"); setTimeout(()=>el.classList.remove("defgain"),400); }
function bossHurt(){ const art=document.getElementById("bossArt"); art.classList.remove("hurt"); void art.offsetWidth; art.classList.add("hurt"); setTimeout(()=>art.classList.remove("hurt"),400); const s=stageScale(), rect=art.getBoundingClientRect(), st=stageEl.getBoundingClientRect(); const el=document.createElement("div"); el.className="slash"; el.style.left=((rect.left-st.left)/s+rect.width/s/2-85)+"px"; el.style.top=((rect.top-st.top)/s+10)+"px"; el.style.width="170px"; el.style.height="170px"; gameEl.appendChild(el); setTimeout(()=>el.remove(),320); }
function redFlash(){ const f=document.getElementById("redFlash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function centerDmg(n){ const b=document.getElementById("centerDmg"); document.getElementById("centerDmgText").textContent="-"+n; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function dmgPop(anchor,text,color){ if(!anchor) return; const s=stageScale(), rect=anchor.getBoundingClientRect(), st=stageEl.getBoundingClientRect(); const p=document.createElement("div"); p.className="dmgPop"; p.textContent=text; p.style.color=color; p.style.left=((rect.left-st.left)/s+rect.width/s/2-20)+"px"; p.style.top=((rect.top-st.top)/s)+"px"; gameEl.appendChild(p); setTimeout(()=>p.remove(),800); }
function flashBadge(id){ const b=document.getElementById(id); if(!b) return; b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:250}); }
function showBanner(t){ const b=document.getElementById("banner"); document.getElementById("bannerText").textContent=t; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function banner(t){ showBanner(t); }

/* ===== 덱 보기 ===== */
document.getElementById("deckViewBtn").addEventListener("click",()=>{
  const row=document.getElementById("deckViewRow"); row.innerHTML="";
  document.getElementById("deckViewCount").textContent=RUN.deckList.length;
  const counts={}; RUN.deckList.forEach(k=>counts[k]=(counts[k]||0)+1);
  Object.keys(counts).forEach(key=>{
    const def=CARDS[key]; if(!def) return;
    const el=document.createElement("div"); el.className="rwCard "+def.type;
    const fallbackIcon=SWORD;
    el.innerHTML=`<div class="hcost">${def.cost}</div><div class="hname">${def.name} ×${counts[key]}</div><img class="hicon" src="${iconURL(def)}" onerror="this.src='${fallbackIcon}'"><div class="hdesc">${(def.desc||"").replace(/\n/g,"<br>")}</div>`;
    row.appendChild(el);
  });
  document.getElementById("deckView").classList.add("on");
});
document.getElementById("deckViewClose").addEventListener("click",()=>{ document.getElementById("deckView").classList.remove("on"); });

/* ===== 입력 처리 ===== */
let tsx,tsy,swiping=false;
boardEl.addEventListener("touchstart",e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; swiping=true; },{passive:true});
boardEl.addEventListener("touchend",e=>{ if(!swiping)return; swiping=false; const t=e.changedTouches[0]; doSwipe(t.clientX-tsx,t.clientY-tsy); },{passive:true});
let bmx,bmy,bmdown=false;
boardEl.addEventListener("mousedown",e=>{ bmx=e.clientX; bmy=e.clientY; bmdown=true; });
addEventListener("mouseup",e=>{ if(!bmdown)return; bmdown=false; doSwipe(e.clientX-bmx,e.clientY-bmy); });
function doSwipe(dx,dy){ if(Math.abs(dx)<30&&Math.abs(dy)<30)return; if(Math.abs(dx)>Math.abs(dy)) slide(dx>0?'right':'left'); else slide(dy>0?'down':'up'); }
addEventListener("keydown",e=>{ if(e.key==="ArrowLeft")slide('left'); else if(e.key==="ArrowRight")slide('right'); else if(e.key==="ArrowUp")slide('up'); else if(e.key==="ArrowDown")slide('down'); else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!document.getElementById("mapScreen").classList.contains("on")) endTurn(); } });

/* ===== 부트스트랩 ===== */
(async function boot(){
  try{
    await loadData();
    for(const k in CARDS){ CARDS[k].__key = k; }
    document.getElementById("loadMsg").classList.add("hidden");
    showBattleUI(false);
    initArchSelect();
    showScreen("arch");
  }catch(err){ /* showLoadError 처리됨 */ }
  window.isStatusCard = function(def){ return !!def.status; };
})();
