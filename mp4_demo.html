<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Random Video Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action: manipulation;
  }
  #stage { position:fixed; inset:0; background:#000; }
  video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain; background:#000;
    opacity:0;
  }
  video.active { opacity:1; }

  #bar {
    position:fixed; z-index:20;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  #folderSel {
    font-size:14px; padding:6px 8px;
    background:rgba(0,0,0,.35); color:#fff;
    border:1px solid rgba(255,255,255,.3); border-radius:8px;
    opacity:.45; transition: opacity .2s;
  }
  #folderSel:focus { opacity:1; }

  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
         color:#888; font:14px monospace; text-align:center; padding:20px; z-index:10; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="stage">
    <video id="vidA" playsinline webkit-playsinline muted></video>
    <video id="vidB" playsinline webkit-playsinline muted></video>
  </div>

  <div id="bar">
    <select id="folderSel"></select>
  </div>

  <div id="msg">목록 읽는 중...</div>

<script>
  const ROOT = "./mp4/";
  const LIST = ROOT + "list.json";    // 폴더/파일 목록 JSON
  const vids = [document.getElementById("vidA"), document.getElementById("vidB")];
  const msg  = document.getElementById("msg");
  const sel  = document.getElementById("folderSel");

  let data = {};          // { 폴더명: [파일명...] }
  let folderNames = [];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  // ===== 재생 상태 =====
  let currentFolder = "";
  let files = [], queue = [], index = 0, cur = 0;
  let handlersBound = false;

  function buildQueue(){ queue = shuffle(files); index = 0; }
  function nextName(){
    if(index >= queue.length) buildQueue();
    return queue[index++];
  }
  function srcOf(name){
    return ROOT + encodeURIComponent(currentFolder) + "/" + encodeURIComponent(name);
  }

  function prepare(video, name){
    return new Promise(resolve => {
      video.src = srcOf(name);
      video.load();
      const ok = () => { video.removeEventListener("canplaythrough", ok); resolve(); };
      video.addEventListener("canplaythrough", ok);
      setTimeout(ok, 1500);
    });
  }

  function onEnded(e){ if(e.target === vids[cur]) swap(); }
  function onError(e){ if(e.target === vids[cur]) swap(); }

  function swap(){
    const old = vids[cur];
    const next = 1 - cur;
    vids[next].classList.add("active");
    vids[next].currentTime = 0;
    vids[next].play().catch(()=>{});
    old.classList.remove("active");
    cur = next;
    prepare(old, nextName());
  }

  async function playFolder(folder){
    currentFolder = folder;
    files = (data[folder] || []).slice();

    if(files.length === 0){
      msg.classList.remove("hidden");
      msg.textContent = "이 폴더에 mp4가 없습니다.";
      return;
    }

    vids.forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); v.classList.remove("active"); });
    cur = 0;
    buildQueue();

    await prepare(vids[cur], nextName());
    vids[cur].classList.add("active");
    vids[cur].play().catch(()=>{});
    await prepare(vids[1 - cur], nextName());

    if(!handlersBound){
      vids.forEach(v => { v.addEventListener("ended", onEnded); v.addEventListener("error", onError); });
      handlersBound = true;
    }
    msg.classList.add("hidden");
  }

  (async function init(){
    try{
      const res = await fetch(LIST, { cache: "no-store" });
      if(!res.ok) throw new Error("list.json 없음");
      data = await res.json();
    }catch(e){
      msg.textContent = "mp4/list.json 을 읽을 수 없습니다.";
      return;
    }

    folderNames = Object.keys(data);
    if(folderNames.length === 0){
      msg.textContent = "list.json 에 폴더가 없습니다.";
      return;
    }

    // 콤보박스: 라벨은 번호, 값은 실제 폴더명
    folderNames.forEach((f, i) => {
      const opt = document.createElement("option");
      opt.value = f;
      opt.textContent = (i + 1);
      sel.appendChild(opt);
    });

    sel.addEventListener("change", () => { playFolder(sel.value); sel.blur(); });

    await playFolder(folderNames[0]);
  })();

  document.addEventListener("touchstart", function once(){
    if(vids[cur] && vids[cur].paused) vids[cur].play().catch(()=>{});
  }, { once:true });

  // 제스처: 핀치줌/드래그 허용, 더블탭/롱프레스 차단
  let lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if(e.target.closest("#bar")) return;
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });
  document.addEventListener("contextmenu", e => {
    if(e.target.closest("#bar")) return;
    e.preventDefault();
  });
</script>
</body>
</html>
