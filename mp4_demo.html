<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Random Video Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    touch-action: manipulation;
  }
  #stage { position:fixed; inset:0; background:#000; }
  video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain; background:#000;
    opacity:0;
  }
  video.active { opacity:1; }

  /* 콤보박스: 영상 가리지 않게 하단에 작게, 반투명 */
  #bar {
    position:fixed; z-index:20;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  #folderSel {
    font-size:14px; padding:6px 8px;
    background:rgba(0,0,0,.35); color:#fff;
    border:1px solid rgba(255,255,255,.3); border-radius:8px;
    opacity:.45;
    transition: opacity .2s;
  }
  #folderSel:focus { opacity:1; }   /* 조작할 때만 선명하게 */

  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
         color:#888; font:14px monospace; text-align:center; padding:20px; z-index:10; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="stage">
    <video id="vidA" playsinline webkit-playsinline muted></video>
    <video id="vidB" playsinline webkit-playsinline muted></video>
  </div>

  <div id="bar">
    <select id="folderSel"></select>
  </div>

  <div id="msg">폴더 목록 읽는 중...</div>

<script>
  const ROOT = "./mp4/";
  const vids = [document.getElementById("vidA"), document.getElementById("vidB")];
  const msg  = document.getElementById("msg");
  const sel  = document.getElementById("folderSel");

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  // 디렉토리 인덱스 HTML을 파싱해서 링크 목록 추출
  async function listLinks(path){
    const res = await fetch(path);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    return [...doc.querySelectorAll("a")]
      .map(a => a.getAttribute("href"))
      .filter(Boolean);
  }

  // href를 파일/폴더명으로 (URL 인코딩된 한글도 복원)
  function baseName(href){
    let h = href.replace(/\/$/, "");      // 끝 슬래시 제거
    h = h.split("/").pop();               // 마지막 조각
    try { h = decodeURIComponent(h); } catch(e) {}
    return h;
  }

  // ./mp4/ 안의 하위 폴더 목록
  async function listFolders(){
    const links = await listLinks(ROOT);
    return [...new Set(
      links
        .filter(h => h.endsWith("/") && !h.startsWith("..") && !h.startsWith("/") && !h.startsWith("?"))
        .map(baseName)
        .filter(h => h)
    )];
  }

  // 특정 폴더 안의 mp4 목록
  async function listMp4(folder){
    const links = await listLinks(ROOT + encodeURIComponent(folder) + "/");
    return [...new Set(
      links
        .filter(h => /\.mp4$/i.test(h))
        .map(baseName)
    )];
  }

  // ===== 재생 상태 =====
  let currentFolder = "";
  let files = [], queue = [], index = 0, cur = 0;
  let handlersBound = false;

  function buildQueue(){ queue = shuffle(files); index = 0; }
  function nextName(){
    if(index >= queue.length) buildQueue();
    return queue[index++];
  }

  function srcOf(name){
    return ROOT + encodeURIComponent(currentFolder) + "/" + encodeURIComponent(name);
  }

  function prepare(video, name){
    return new Promise(resolve => {
      video.src = srcOf(name);
      video.load();
      const ok = () => { video.removeEventListener("canplaythrough", ok); resolve(); };
      video.addEventListener("canplaythrough", ok);
      setTimeout(ok, 1500);   // 이벤트 누락 대비
    });
  }

  function onEnded(e){ if(e.target === vids[cur]) swap(); }
  function onError(e){ if(e.target === vids[cur]) swap(); }

  function swap(){
    const old = vids[cur];
    const next = 1 - cur;
    vids[next].classList.add("active");
    vids[next].currentTime = 0;
    vids[next].play().catch(()=>{});
    old.classList.remove("active");
    cur = next;
    prepare(old, nextName());
  }

  async function playFolder(folder){
    currentFolder = folder;
    msg.classList.remove("hidden");
    msg.textContent = "영상 목록 읽는 중...";

    try{
      files = await listMp4(folder);
    }catch(e){
      msg.textContent = "폴더를 읽을 수 없습니다.";
      return;
    }
    if(files.length === 0){
      msg.textContent = "이 폴더에 mp4가 없습니다.";
      return;
    }

    // 상태 초기화
    vids.forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); v.classList.remove("active"); });
    cur = 0;
    buildQueue();

    await prepare(vids[cur], nextName());
    vids[cur].classList.add("active");
    vids[cur].play().catch(()=>{});
    await prepare(vids[1 - cur], nextName());

    if(!handlersBound){
      vids.forEach(v => { v.addEventListener("ended", onEnded); v.addEventListener("error", onError); });
      handlersBound = true;
    }

    msg.classList.add("hidden");
  }

  (async function init(){
    let folders = [];
    try{
      folders = await listFolders();
    }catch(e){
      msg.textContent = "폴더 목록을 읽을 수 없습니다.\n(로컬 서버로 실행하세요)";
      return;
    }
    if(folders.length === 0){
      msg.textContent = "mp4 아래에 하위 폴더가 없습니다.";
      return;
    }

    // 콤보박스 채우기: 라벨은 번호(idx), 값은 실제 폴더명
    folders.forEach((f, i) => {
      const opt = document.createElement("option");
      opt.value = f;                // 재생에 쓰는 실제 폴더명
      opt.textContent = (i + 1);    // 화면에는 번호만
      sel.appendChild(opt);
    });

    sel.addEventListener("change", () => {
      playFolder(sel.value);
      sel.blur();                   // 선택 후 다시 흐리게
    });

    await playFolder(folders[0]);   // 첫 폴더 자동 재생
  })();

  // iOS 자동재생 대응: 첫 터치 시 재생 보장
  document.addEventListener("touchstart", function once(){
    if(vids[cur] && vids[cur].paused) vids[cur].play().catch(()=>{});
  }, { once:true });

  // ===== 제스처: 핀치줌/드래그 허용, 더블탭/롱프레스 차단 =====
  let lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if(e.target.closest("#bar")) return;   // 콤보박스 조작은 예외
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });
  document.addEventListener("contextmenu", e => {
    if(e.target.closest("#bar")) return;
    e.preventDefault();
  });
</script>
</body>
</html>
